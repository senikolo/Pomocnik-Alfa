name: Build Pomocnik Alfa 1.7.36 Czytnik Alfa

on:
  workflow_dispatch:
  push:
    paths:
      - 'triggers/build-1736-reader.txt'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Pomocnik Alfa 1.7.35 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir artifact project
          gh run download 37517555930 -R senikolo/Pomocnik-Alfa -n Pomocnik-Alfa-1.7.35-ANDROID7-SOURCE -D artifact
          tar -xJf artifact/Pomocnik-Alfa-1.7.35-ANDROID7-SOURCE.tar.xz -C project
          grep -n "versionCode 10735" project/app/build.gradle

      - name: Add Czytnik Alfa sources
        run: |
          set -euxo pipefail
          mkdir -p project/app/src/main/java/com/ispina/lokalnie
          base64 -d helpers/czytnik-alfa/ReaderActivity.java.gz.b64 | gzip -dc > project/app/src/main/java/com/ispina/lokalnie/ReaderActivity.java
          base64 -d helpers/czytnik-alfa/AlfaMobiBridge.kt.gz.b64 | gzip -dc > project/app/src/main/java/com/ispina/lokalnie/AlfaMobiBridge.kt
          grep -n "class ReaderActivity" project/app/src/main/java/com/ispina/lokalnie/ReaderActivity.java
          grep -n "object AlfaMobiBridge" project/app/src/main/java/com/ispina/lokalnie/AlfaMobiBridge.kt

      - name: Add offline MOBI parser
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/ChengqianHuang/Reader.git /tmp/localreader
          mkdir -p project/app/src/main/java/com/localreader/lib
          cp -R /tmp/localreader/app/src/main/java/com/localreader/lib/mobi project/app/src/main/java/com/localreader/lib/
          mkdir -p project/app/src/main/assets/licenses
          cp /tmp/localreader/LICENSE project/app/src/main/assets/licenses/LocalReader-MIT-LICENSE.txt
          test -f project/app/src/main/java/com/localreader/lib/mobi/MobiReader.kt

      - name: Patch Pomocnik Alfa 1.7.36
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          root=Path("project/build.gradle")
          s=root.read_text()
          if "org.jetbrains.kotlin.android" not in s:
              s=s.replace(
                  "id 'com.android.application' version '8.5.2' apply false",
                  "id 'com.android.application' version '8.5.2' apply false\n    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false"
              )
          root.write_text(s)

          p=Path("project/app/build.gradle")
          s=p.read_text()
          s=s.replace("plugins { id 'com.android.application' }",
                      "plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }")
          s=s.replace("applicationId 'com.senikolo.pomocniknowy.android7compat'",
                      "applicationId 'com.senikolo.pomocniknowy'")
          s=s.replace("versionCode 10735","versionCode 10736")
          s=s.replace("versionName '1.7.35'","versionName '1.7.36'")
          if "kotlinOptions" not in s:
              s=s.replace(
                  "compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }",
                  "compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }\n    kotlinOptions { jvmTarget = '17' }"
              )
          if "kotlin-stdlib" not in s:
              s=s.replace("dependencies {",
                          "dependencies {\n    implementation \"org.jetbrains.kotlin:kotlin-stdlib:2.0.21\"")
          p.write_text(s)

          m=Path("project/app/src/main/AndroidManifest.xml")
          s=m.read_text()
          s=s.replace('android:label="Pomocnik Alfa Android 7"','android:label="Pomocnik Alfa"')
          anchor='<activity android:name=".NotesActivity" android:exported="false" />'
          assert anchor in s
          s=s.replace(anchor, anchor+'\n        <activity android:name=".ReaderActivity" android:exported="false" />')
          m.write_text(s)

          main=Path("project/app/src/main/java/com/ispina/lokalnie/MainActivity.java")
          s=main.read_text()
          s=s.replace("POMOCNIK ALFA 1.7.25","POMOCNIK ALFA 1.7.36")
          note='addActionCard("Notatki","Szybka lokalna notatka bez konta i chmury.",v->startActivity(new Intent(this,NotesActivity.class)));'
          assert note in s
          reader='addActionCard("Czytnik Alfa","PDF, EPUB, MOBI/AZW, DOC/DOCX, ODT, TXT, RTF, HTML, FB2 i Markdown.",v->startActivity(new Intent(this,ReaderActivity.class)));'
          s=s.replace(note, reader+"\n        "+note)
          s=s.replace('title.equals("Oszczędzacz")?"💰":title.equals("Notatki")',
                      'title.equals("Oszczędzacz")?"💰":title.equals("Czytnik Alfa")?"📚":title.equals("Notatki")')
          main.write_text(s)
          PY
          grep -n "versionCode 10736" project/app/build.gradle
          grep -n "applicationId 'com.senikolo.pomocniknowy'" project/app/build.gradle
          grep -n "ReaderActivity" project/app/src/main/AndroidManifest.xml
          grep -n "Czytnik Alfa" project/app/src/main/java/com/ispina/lokalnie/MainActivity.java

      - name: Prepare Android SDK
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: project
        run: |
          set -euxo pipefail
          chmod +x gradlew
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          ./gradlew --no-daemon assembleRelease -x lint --stacktrace
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" ../Pomocnik-Alfa-1.7.36-CZYTNIK-ALFA-UNSIGNED.apk
          cd ..
          tar -cJf Pomocnik-Alfa-1.7.36-CZYTNIK-ALFA-SOURCE.tar.xz project

      - name: Verify unsigned APK
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s Pomocnik-Alfa-1.7.36-CZYTNIK-ALFA-UNSIGNED.apk
          "$BT/aapt" dump badging Pomocnik-Alfa-1.7.36-CZYTNIK-ALFA-UNSIGNED.apk | head -5
          "$BT/aapt" dump badging Pomocnik-Alfa-1.7.36-CZYTNIK-ALFA-UNSIGNED.apk | grep "package: name='com.senikolo.pomocniknowy'"
          "$BT/aapt" dump badging Pomocnik-Alfa-1.7.36-CZYTNIK-ALFA-UNSIGNED.apk | grep "versionCode='10736'"
          unzip -l Pomocnik-Alfa-1.7.36-CZYTNIK-ALFA-UNSIGNED.apk | grep "LocalReader-MIT-LICENSE"
          sha256sum Pomocnik-Alfa-1.7.36-CZYTNIK-ALFA-UNSIGNED.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pomocnik-Alfa-1.7.36-CZYTNIK-ALFA-UNSIGNED
          path: Pomocnik-Alfa-1.7.36-CZYTNIK-ALFA-UNSIGNED.apk
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: Pomocnik-Alfa-1.7.36-CZYTNIK-ALFA-SOURCE
          path: Pomocnik-Alfa-1.7.36-CZYTNIK-ALFA-SOURCE.tar.xz
          retention-days: 3
