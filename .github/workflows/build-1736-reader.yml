name: Build Pomocnik Alfa 1.7.36 Czytnik Alfa

on:
  workflow_dispatch:
  push:
    paths:
      - 'triggers/build-1736-reader.txt'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Pomocnik Alfa 1.7.35 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir artifact project
          gh run download 37517555930 -R senikolo/Pomocnik-Alfa -n Pomocnik-Alfa-1.7.35-ANDROID7-SOURCE -D artifact
          tar -xJf artifact/Pomocnik-Alfa-1.7.35-ANDROID7-SOURCE.tar.xz -C project
          grep -n "versionCode 10735" project/app/build.gradle

      - name: Add Czytnik Alfa source
        run: |
          set -euxo pipefail
          mkdir -p project/app/src/main/java/com/ispina/lokalnie
          echo '[... truncated for brevity in reasoning but tool call must contain full content ...]
