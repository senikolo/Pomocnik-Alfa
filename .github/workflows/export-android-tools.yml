name: Export Android Build Tools

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

jobs:
  export:
    if: ${{ github.event_name != 'issues' || github.event.issue.title == 'TRIGGER EXPORT ANDROID TOOLS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Android build tools
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;35.0.0"
          test -x "/usr/local/lib/android/sdk/build-tools/35.0.0/apksigner"
          test -x "/usr/local/lib/android/sdk/build-tools/35.0.0/zipalign"
          tar -cJf android-build-tools-35.tar.xz -C "/usr/local/lib/android/sdk/build-tools" 35.0.0
      - name: Upload tools
        uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-35
          path: android-build-tools-35.tar.xz
          retention-days: 1
          if-no-files-found: error
