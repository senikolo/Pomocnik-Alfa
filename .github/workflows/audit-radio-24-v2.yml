name: Audit 24 radio stations metadata v2

on:
  push:
    paths:
      - 'triggers/audit-radio-24-v2.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Run live metadata audit
        run: |
          cat > /tmp/audit24.py <<'PY'
          import urllib.request, urllib.error, re, html, json, datetime, zoneinfo, time
          WARSAW=zoneinfo.ZoneInfo("Europe/Warsaw")
          BERLIN=zoneinfo.ZoneInfo("Europe/Berlin")
          UA="Mozilla/5.0 (Linux; Android 11) AppleWebKit/537.36 Chrome/126.0 Mobile Safari/537.36"
          stations=[
          ("Program 1 Polskiego Radia","https://stream11.polskieradio.pl/pr1/pr1.sdp/playlist.m3u8","pr1","https://apipr.polskieradio.pl/api/schedule?Program=1"),
          ("Program 3 Polskiego Radia","https://stream13.polskieradio.pl/pr3/pr3.sdp/playlist.m3u8","pr3","https://apipr.polskieradio.pl/api/schedule?Program=3"),
          ("TOK FM","https://radiostream.pl/tuba10-1.mp3","tok","https://audycje.tokfm.pl/ramowka?v=2"),
          ("ESKA Bochnia","https://ic1.smcdn.pl/2330-1.mp3","played","https://www.eska.pl/co-bylo-grane/"),
          ("RMF FM","https://rs103-krk-cyfronet.rmfstream.pl/RMFFM48","rmffm","https://www.rmf.fm/"),
          ("Radio ZET","https://zt02.cdn.eurozet.pl/zet-old.mp3","zet","https://player.radiozet.pl/Programy"),
          ("VOX FM","https://ic2.smcdn.pl/3990-1.mp3","played","https://www.voxfm.pl/co-bylo-grane/"),
          ("RMF Classic","https://rs9-krk2.rmfstream.pl/rmf_classic","rmfclassic","https://www.rmfclassic.pl/radio/ramowka"),
          ("RMF MAXX","https://rs9-krk2-cyfronet.rmfstream.pl/RMFMAXXX48","rmfmaxx","https://www.rmfmaxx.pl/muzyka/playlista"),
          ("Złote Przeboje","https://radiostream.pl/tuba8904-1.mp3","timeartist","https://radio.zloteprzeboje.pl/co-gralismy"),
          ("Radio Pogoda","https://hub.radiostream.pl/stream.pls?radio=38&type=none&app=none&coding=mp3&redirect=true","timeartist","https://moje.radiopogoda.pl/co-gralismy"),
          ("Eska2","https://waw.ic.smcdn.pl/6040-1.aac","played","https://dwa.eska.pl/co-bylo-grane/"),
          ("Eska ROCK","https://n07-eu.rcs.revma.com/1nnezw8qz7zuv","played","https://www.eskarock.pl/co-bylo-grane/"),
          ("1.FM Birds","https://strm112.1.fm/brazilianbirds_mobile_mp3","fixed",""),
          ("Radio Arabella München","https://edge21.stream.radioarabella.de/radioarabella-muenchen/stream/mp3","arabella","https://www.radioarabella.de/"),
          ("Antenne Bayern","https://stream.antenne.de/antenne/stream/mp3","gerade","https://www.antenne.de/webradio/live"),
          ("Bayern 2","https://dispatcher.rndfnk.com/br/br2/live/mp3/mid","br","https://www.br.de/radio/live/bayern-2/"),
          ("Bayern 3","https://dispatcher.rndfnk.com/br/br3/live/mp3/mid","br","https://www.br.de/radio/live/bayern-3/"),
          ("Deutschlandfunk","https://st01.sslstream.dlf.de/dlf/01/low/aac/stream.aac?aggregator=web","dlf","https://www.deutschlandfunk.de/programm/"),
          ("ROCK ANTENNE","https://stream.rockantenne.de/rockantenne/stream/mp3","gerade","https://www.rockantenne.de/rockhoeren/streams/live"),
          ("BR24","https://dispatcher.rndfnk.com/br/br24/live/mp3/mid","br","https://www.br.de/radio/live/br24/"),
          ("BR-KLASSIK","https://dispatcher.rndfnk.com/br/brklassik/live/mp3/mid","br","https://www.br.de/radio/live/br-klassik/"),
          ("BR Heimat","https://dispatcher.rndfnk.com/br/brheimat/live/mp3/mid","br","https://www.br.de/radio/live/br-heimat/"),
          ("Deutschlandfunk Kultur","https://st02.sslstream.dlf.de/dlf/02/low/aac/stream.aac?aggregator=web","dlfk","https://www.deutschlandfunkkultur.de/"),
          ]

          def fetch(url, timeout=15, attempts=2, extra=None):
              last=None
              for a in range(attempts):
                  try:
                      h={"User-Agent":UA,"Accept":"text/html,application/xhtml+xml,application/json,text/plain,*/*","Accept-Language":"pl-PL,pl;q=0.9,de;q=0.8,en;q=0.6","Cache-Control":"no-cache"}
                      if extra:h.update(extra)
                      req=urllib.request.Request(url,headers=h)
                      with urllib.request.urlopen(req,timeout=timeout) as r:
                          data=r.read(1800000)
                          return data.decode("utf-8","ignore")
                  except Exception as e:
                      last=e; time.sleep(.4*(a+1))
              return ""

          def clean_text(s):
              s=re.sub(r'(?is)<script[^>]*>.*?</script>',' ',s)
              s=re.sub(r'(?is)<style[^>]*>.*?</style>',' ',s)
              s=re.sub(r'(?i)<br\s*/?>','\n',s)
              s=re.sub(r'(?i)</(p|div|li|h[1-6]|section|article|tr|td|a)>','\n',s)
              s=re.sub(r'(?s)<[^>]+>',' ',s)
              s=html.unescape(s).replace('\xa0',' ')
              return [' '.join(x.split()) for x in re.split(r'[\r\n]+',s) if ' '.join(x.split())]

          def probe_icy(url):
              if '.m3u8' in url:return ('HLS','')
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":UA,"Icy-MetaData":"1","Accept":"*/*"})
                  with urllib.request.urlopen(req,timeout=8) as r:
                      headers={k.lower():v for k,v in r.headers.items()}
                      mi=int(headers.get("icy-metaint","0") or 0)
                      if mi<=0:return ('NO','')
                      left=mi
                      while left:
                          b=r.read(min(left,32768))
                          if not b:break
                          left-=len(b)
                      z=r.read(1)
                      if not z:return ('YES','')
                      raw=r.read(z[0]*16).decode("latin1","ignore").replace(chr(0),'').strip()
                      m=re.search(r"StreamTitle=['\"]([^'\"]*)",raw,re.I)
                      return ('YES',(m.group(1).strip() if m else raw)[:100])
              except Exception as e:return ('ERR',type(e).__name__)

          def minutes(s):
              m=re.fullmatch(r'([01]?\d|2[0-3]):([0-5]\d)',s.strip())
              return int(m.group(1))*60+int(m.group(2)) if m else -1

          def official(kind,url):
              if kind=="fixed":return ("OK","odgłosy natury")
              if kind in ("pr1","pr3"):
                  raw=fetch(url,12,3,{"Origin":"https://player.polskieradio.pl","Referer":"https://player.polskieradio.pl/"})
                  try:
                      j=json.loads(raw); rows=j.get("Schedule") or []
                      now=datetime.datetime.now(datetime.timezone.utc)
                      best=None
                      for x in rows:
                          title=(x.get("Title") or "").strip()
                          if x.get("IsActive") and title:return ("OK",title[:100])
                          if title:best=title
                      return ("OK",best[:100]) if best else ("NO","")
                  except:return ("NO","bad json")
              if kind=="tok":
                  shell=fetch(url,30,3)
                  m=re.search(r"/_server-islands/ScheduleListIsland\?[^\"']+",shell)
                  if not m:return ("NO","no island")
                  island=fetch("https://audycje.tokfm.pl"+html.unescape(m.group(0)),30,3)
                  now=datetime.datetime.now(WARSAW); day=now.weekday(); nowm=now.hour*60+now.minute
                  dm=re.search(rf'(?is)<ul[^>]*data-day=["\']?{day}["\']?[^>]*>(.*?)</ul>',island)
                  if not dm:return ("NO","no day")
                  best=(-1,"")
                  for im in re.finditer(r'(?is)<li[^>]*data-time=["\']([0-2]?\d:[0-5]\d)["\'][^>]*>(.*?)</li>',dm.group(1)):
                      mm=minutes(im.group(1))
                      if mm>nowm or mm<best[0]:continue
                      am=re.search(r'(?is)<h3[^>]*tok-schedule__program--name[^>]*>\s*<a[^>]*href=["\']/audycja/[^"\']*["\'][^>]*>(.*?)</a>',im.group(2))
                      if am:
                          name=' '.join(html.unescape(re.sub(r'<[^>]+>',' ',am.group(1))).split())
                          if name:best=(mm,name)
                  return ("OK",best[1][:100]) if best[1] else ("NO","no current")
              raw=fetch(url,15,2)
              if not raw:return ("ERR","fetch")
              lines=clean_text(raw)
              low='\n'.join(lines).lower()
              if kind=="played":
                  matches=re.findall(r'(?i)grali(?:śmy|smy)\s+o\s+([01]?\d|2[0-3]):([0-5]\d)', '\n'.join(lines))
                  return ("OK","played-at page") if matches else ("NO","no played marker")
              if kind=="timeartist":
                  times=[x for x in lines if minutes(x)>=0]
                  return ("OK",f"{len(times)} time rows") if times else ("NO","no time rows")
              if kind=="rmffm":
                  return ("OK","Co było grane") if ("co było grane" in low or "co bylo grane" in low) else ("NO","marker missing")
              if kind=="rmfclassic":
                  return ("OK","ON AIR") if ("on air" in low or "co było grane w rmf classic" in low) else ("NO","marker missing")
              if kind=="rmfmaxx":
                  return ("OK","playlista") if ("lista utworów zagranych" in low or "playlista rmf maxx" in low) else ("NO","marker missing")
              if kind=="zet":
                  ranges=re.findall(r'([01]?\d|2[0-3]):[0-5]\d\s*[-–]\s*([01]?\d|2[0-3]):[0-5]\d','\n'.join(lines))
                  return ("OK",f"{len(ranges)} ranges") if ranges else ("NO","no ranges")
              if kind=="gerade":
                  return ("OK","Gerade läuft") if ("gerade läuft" in low or "gerade laeuft" in low) else ("NO","marker missing")
              if kind=="arabella":
                  return ("OK","On Air/Zuletzt gehört") if ("on air" in low or "zuletzt gehört" in low or "zuletzt gehort" in low) else ("NO","marker missing")
              if kind=="br":
                  ranges=re.findall(r'([01]?\d|2[0-3]):[0-5]\d\s*[-–]\s*([01]?\d|2[0-3]):[0-5]\d','\n'.join(lines))
                  return ("OK",f"{len(ranges)} schedule ranges") if (ranges or "jetzt läuft" in low) else ("NO","no schedule marker")
              if kind=="dlf":
                  times=[x for x in lines if minutes(x)>=0]
                  return ("OK",f"{len(times)} time rows") if times else ("NO","no times")
              if kind=="dlfk":
                  m=re.search(r'(?i)Live\s*Seit\s*\d{1,2}:\d{2}\s*Uhr\s*(.+)','\n'.join(lines))
                  return ("OK",(m.group(1)[:100] if m else "Live page")) if ("live" in low) else ("NO","no live")
              return ("NO","unknown")

          print("AUDIT_BEGIN")
          ok=0
          for name,stream,kind,url in stations:
              icy,icyval=probe_icy(stream)
              off,detail=official(kind,url)
              if icy=="YES" or off=="OK" or kind=="fixed": ok+=1
              print(f"AUDIT|{name}|ICY={icy}|OFFICIAL={off}|SAMPLE={(icyval or detail).replace('|','/')}")
          print(f"AUDIT_SUMMARY|{ok}/{len(stations)}")
          PY
          python /tmp/audit24.py | tee /tmp/audit24.txt

      - uses: actions/upload-artifact@v4
        with:
          name: radio-audit-24-v2
          path: /tmp/audit24.txt
          retention-days: 3
