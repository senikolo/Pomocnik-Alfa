name: PA6 2.4.5 • Android 6 QA (separate test build)
on:
  push:
    branches: ['work/pa6-245-stream-ui-20261019']
    paths: ['.github/workflows/pa6-245-ci-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  android6-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and exercise actual production HTTP/HLS relay
        run: |
          set -euo pipefail
          mkdir -p results/relay
          javac -source 8 -target 8 -encoding UTF-8 -d results/relay \
            helpers/pa6/native/PA6StreamRelay.java helpers/pa6/StreamRelayTest.java
          timeout 90s java -cp results/relay com.ispina.lokalnie.StreamRelayTest \
            | tee results/stream-relay-tests.txt
          grep -q '^PASS ' results/stream-relay-tests.txt
      - name: Prepare separate QA APK package
        run: |
          set -euo pipefail
          # This APK is for a fresh CI emulator only: NEVER replace the user's signed 2.4.5.
          sed -i 's/package="com.senikolo.pa6.stable"/package="com.senikolo.pa6.tv243"/' helpers/pa6/AndroidManifest.xml
          echo "PA6_APP_ID=com.senikolo.pa6.tv243" >> "$GITHUB_ENV"
      - name: Build complete Android 6 application
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash helpers/pa6/build.sh
      - name: Test-sign fresh CI-only APK and verify
        run: |
          set -euo pipefail
          mkdir -p pa6 results
          export QA_KEY_PASS=temporary-ci-test-certificate
          keytool -genkeypair -noprompt -alias "qa245" -keyalg RSA -keysize 3072 \
            -validity 30 -storetype PKCS12 -keystore /tmp/qa245.p12 \
            -storepass "$QA_KEY_PASS" -keypass "$QA_KEY_PASS" \
            -dname "CN=PA6 2.4.5 QA NOT FOR INSTALL,OU=Automated Tests,O=PA,C=PL"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" sign --ks /tmp/qa245.p12 --ks-type PKCS12 \
            --ks-key-alias qa245 --ks-pass env:QA_KEY_PASS --key-pass env:QA_KEY_PASS \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out pa6/PA6-2.4.5-QA-ONLY.apk output/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs pa6/PA6-2.4.5-QA-ONLY.apk > pa6/signature.txt
          "$BT/aapt" dump badging pa6/PA6-2.4.5-QA-ONLY.apk | tee pa6/badging.txt
          grep -q "package: name='com.senikolo.pa6.tv243' versionCode='2004005'" pa6/badging.txt
          grep -q "sdkVersion:'23'" pa6/badging.txt
          (cd pa6 && sha256sum *.apk > SHA256SUMS.txt)
          echo 'QA-ONLY: different certificate from production. Do not install over user PA6.' > pa6/QA-NOT-RELEASE.txt
          # The old smoke test still refers to the prior version's APK filename.
          sed -i 's/Pomocnik-Alfa-6-2.4.2-Premium-Preview.apk/PA6-2.4.5-QA-ONLY.apk/g' helpers/pa6/smoke.sh
      - name: Install local video test fixtures
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 6 device UI and playback regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86
          target: default
          profile: Nexus 10
          disable-animations: true
          emulator-boot-timeout: 700
          script: |
            bash helpers/pa6/smoke.sh
            bash helpers/pa6/premium_smoke.sh
      - name: Upload test evidence (not a production APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PA6-2.4.5-QA-Test-Reports
          path: |
            results
            pa6/badging.txt
            pa6/signature.txt
            output/stream-relay-tests.txt
            output/route-tests.txt
            output/transport-tests.txt
          retention-days: 45
