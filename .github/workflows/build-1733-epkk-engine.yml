name: Build Pomocnik Alfa 1.7.33 EPKK Engine Fix

on:
  workflow_dispatch:
  push:
    paths:
      - 'triggers/build-1733-epkk-engine.txt'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify EPKK widget engine scripts
        run: |
          set -euxo pipefail
          UA='Mozilla/5.0 (Linux; Android 11) AppleWebKit/537.36 Chrome/126.0 Mobile Safari/537.36'
          curl -L -A "$UA" --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 -fsS             'https://mytuner-radio.com/static/js/widgets/widget-player-v1.js' -o /tmp/widget-player-v1.js
          curl -L -A "$UA" --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 -fsS             'https://mytuner-radio.com/static/js/widgets/player-v1.js' -o /tmp/player-v1.js
          grep -q 'window.addPlayerInstance' /tmp/widget-player-v1.js
          grep -q 'addPlayerInstance(widget_id' /tmp/player-v1.js
          echo 'EPKK widget engine order dependencies verified'

      - name: Restore verified 1.7.32 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir artifact project
          gh run download 37502971143 -R senikolo/Pomocnik-Alfa -n Pomocnik-Alfa-1.7.32-SOURCE -D artifact
          tar -xJf artifact/Pomocnik-Alfa-1.7.32-SOURCE.tar.xz -C project
          grep -n "versionCode 10732" project/app/build.gradle
          grep -n "RadioInfo++" project/app/src/main/java/com/ispina/lokalnie/radio/RadioInfoPlus.java
          grep -n "fetchTokFmSchedule" project/app/src/main/java/com/ispina/lokalnie/radio/RadioInfoPlus.java

      - name: Apply EPKK engine fix
        run: |
          set -euxo pipefail
          cp overlays/1.7.33/AviationActivity.java project/app/src/main/java/com/ispina/lokalnie/AviationActivity.java
          python - <<'PY'
          from pathlib import Path
          p=Path('project/app/build.gradle')
          s=p.read_text()
          assert 'versionCode 10732' in s
          s=s.replace('versionCode 10732','versionCode 10733')
          s=s.replace("versionName '1.7.32'","versionName '1.7.33'")
          p.write_text(s)
          PY
          grep -n "versionCode 10733" project/app/build.gradle
          grep -n "widget-player-v1.js" project/app/src/main/java/com/ispina/lokalnie/AviationActivity.java
          grep -n "pollEngineReady" project/app/src/main/java/com/ispina/lokalnie/AviationActivity.java
          grep -n "engine_init" project/app/src/main/java/com/ispina/lokalnie/AviationActivity.java
          cd project
          tar -cJf ../Pomocnik-Alfa-1.7.33-SOURCE.tar.xz .

      - name: Make side-by-side test package
        run: |
          set -euxo pipefail
          sed -i "s/applicationId 'com.senikolo.pomocniknowy'/applicationId 'com.senikolo.pomocniknowy.epkk1733'/" project/app/build.gradle
          sed -i 's/android:label="Pomocnik Alfa"/android:label="Pomocnik Alfa EPKK 1.7.33"/' project/app/src/main/AndroidManifest.xml

      - name: Prepare Android SDK
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: project
        run: |
          set -euxo pipefail
          chmod +x gradlew
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          android.useAndroidX=true
          EOF
          ./gradlew --no-daemon assembleDebug -x lint --stacktrace
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" ../Pomocnik-Alfa-1.7.33-EPKK-ENGINE-FIX.apk

      - name: Verify APK
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s Pomocnik-Alfa-1.7.33-EPKK-ENGINE-FIX.apk
          "$BT/aapt" dump badging Pomocnik-Alfa-1.7.33-EPKK-ENGINE-FIX.apk | head -3
          "$BT/apksigner" verify --verbose --print-certs Pomocnik-Alfa-1.7.33-EPKK-ENGINE-FIX.apk
          sha256sum Pomocnik-Alfa-1.7.33-EPKK-ENGINE-FIX.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pomocnik-Alfa-1.7.33-EPKK-ENGINE-FIX
          path: Pomocnik-Alfa-1.7.33-EPKK-ENGINE-FIX.apk
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: Pomocnik-Alfa-1.7.33-SOURCE
          path: Pomocnik-Alfa-1.7.33-SOURCE.tar.xz
          retention-days: 3
