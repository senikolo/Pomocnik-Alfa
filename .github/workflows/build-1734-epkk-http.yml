name: Build Pomocnik Alfa 1.7.34 EPKK Direct Stream

on:
  workflow_dispatch:
  push:
    paths:
      - 'triggers/build-1734-epkk-http.txt'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify direct EPKK LiveATC stream
        run: |
          set -euxo pipefail
          UA='Mozilla/5.0 (Linux; Android 11) AppleWebKit/537.36 Chrome/126.0 Mobile Safari/537.36'
          rm -f /tmp/epkk.h /tmp/epkk.mp3
          curl -L -A "$UA" --connect-timeout 10 --max-time 8 -sS -D /tmp/epkk.h -o /tmp/epkk.mp3             'https://d.liveatc.net/epkk_app' || true
          cat /tmp/epkk.h
          grep -qi 'content-type: audio/mpeg' /tmp/epkk.h
          grep -qi 'icy-name: EPKK Twr/App' /tmp/epkk.h
          test "$(wc -c </tmp/epkk.mp3)" -gt 5000
          file /tmp/epkk.mp3 | grep -Eqi 'MPEG|audio'
          echo 'Direct EPKK Twr/App stream verified'

      - name: Restore verified 1.7.33 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir artifact project
          gh run download 37507518318 -R senikolo/Pomocnik-Alfa -n Pomocnik-Alfa-1.7.33-SOURCE -D artifact
          tar -xJf artifact/Pomocnik-Alfa-1.7.33-SOURCE.tar.xz -C project
          grep -n "versionCode 10733" project/app/build.gradle
          grep -n "RadioInfo++" project/app/src/main/java/com/ispina/lokalnie/radio/RadioInfoPlus.java
          grep -n "fetchTokFmSchedule" project/app/src/main/java/com/ispina/lokalnie/radio/RadioInfoPlus.java

      - name: Apply native direct EPKK player
        run: |
          set -euxo pipefail
          cp overlays/1.7.34/AviationActivity.java project/app/src/main/java/com/ispina/lokalnie/AviationActivity.java
          python - <<'PY'
          from pathlib import Path
          p=Path('project/app/build.gradle')
          s=p.read_text()
          assert 'versionCode 10733' in s
          s=s.replace('versionCode 10733','versionCode 10734')
          s=s.replace("versionName '1.7.33'","versionName '1.7.34'")
          p.write_text(s)
          PY
          grep -n "versionCode 10734" project/app/build.gradle
          grep -n "d.liveatc.net/epkk_app" project/app/src/main/java/com/ispina/lokalnie/AviationActivity.java
          grep -n "RadioService.ACTION_PLAY" project/app/src/main/java/com/ispina/lokalnie/AviationActivity.java
          ! grep -q "WebView" project/app/src/main/java/com/ispina/lokalnie/AviationActivity.java
          cd project
          tar -cJf ../Pomocnik-Alfa-1.7.34-SOURCE.tar.xz .

      - name: Make side-by-side test package
        run: |
          set -euxo pipefail
          sed -i "s/applicationId 'com.senikolo.pomocniknowy'/applicationId 'com.senikolo.pomocniknowy.epkk1734direct'/" project/app/build.gradle
          sed -i 's/android:label="Pomocnik Alfa"/android:label="Pomocnik Alfa EPKK DIRECT 1.7.34"/' project/app/src/main/AndroidManifest.xml

      - name: Prepare Android SDK
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: project
        run: |
          set -euxo pipefail
          chmod +x gradlew
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          android.useAndroidX=true
          EOF
          ./gradlew --no-daemon assembleDebug -x lint --stacktrace
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" ../Pomocnik-Alfa-1.7.34-EPKK-DIRECT.apk

      - name: Verify APK
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s Pomocnik-Alfa-1.7.34-EPKK-DIRECT.apk
          "$BT/aapt" dump badging Pomocnik-Alfa-1.7.34-EPKK-DIRECT.apk | head -3
          "$BT/apksigner" verify --verbose --print-certs Pomocnik-Alfa-1.7.34-EPKK-DIRECT.apk
          sha256sum Pomocnik-Alfa-1.7.34-EPKK-DIRECT.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pomocnik-Alfa-1.7.34-EPKK-DIRECT
          path: Pomocnik-Alfa-1.7.34-EPKK-DIRECT.apk
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: Pomocnik-Alfa-1.7.34-SOURCE
          path: Pomocnik-Alfa-1.7.34-SOURCE.tar.xz
          retention-days: 3
