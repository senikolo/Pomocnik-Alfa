name: PA6 Premium • remaining module verification on the same signed APK
on:
  push:
    branches: ['work/pa6-242-premium-20261019']
    paths: ['.github/workflows/pa6-242-postflight.yml']
permissions:
  contents: read
  actions: read
jobs:
  remaining-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the signed build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..35}; do
            state=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/39204199539 --jq .status)
            [[ "$state" == completed ]] && exit 0
            sleep 20
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: PA6-2.4.2-Android6-Signed-APK
          github-token: ${{ github.token }}
          run-id: 39204199539
          path: qa
      - name: Prepare isolated module verification
        run: |
          mkdir -p results
          cat > /tmp/postflight.py <<'PY'
          import subprocess,time,re,xml.etree.ElementTree as ET,json,hashlib
          from pathlib import Path
          apk=next(Path('qa').rglob('*.apk'))
          package='com.senikolo.pa6.preview242'
          def adb(*args):return subprocess.check_output(['adb',*args],text=True)
          def start(name,*extras):
              adb('shell','am','force-stop',package)
              adb('shell','am','start','-W','-n',package+'/com.ispina.lokalnie.'+name,*extras)
              time.sleep(4)
          def dump(name):
              subprocess.run(['timeout','25s','adb','shell','uiautomator','dump','/sdcard/postflight.xml'],check=True)
              xml=adb('shell','cat','/sdcard/postflight.xml');Path('results/'+name+'.xml').write_text(xml)
              with open('results/'+name+'.png','wb') as out:subprocess.run(['adb','exec-out','screencap','-p'],stdout=out,check=True)
              return list(ET.fromstring(xml).iter('node'))
          def click(nodes,text):
              for n in nodes:
                  if text in (n.get('text','')+' '+n.get('content-desc','')) and n.get('clickable')=='true':
                      x1,y1,x2,y2=map(int,re.findall(r'\d+',n.get('bounds')))
                      adb('shell','input','tap',str((x1+x2)//2),str((y1+y2)//2));time.sleep(2);return
              raise AssertionError('Missing clickable '+text)
          adb('root');adb('wait-for-device');adb('install',str(apk));adb('logcat','-c')
          start('PARegionsActivity')
          nodes=dump('transport-planner')
          assert any('Dokąd dziś jedziemy' in n.get('text','') for n in nodes),'Transport WebView not rendered'
          for tab,key in [('Pojazdy','vehicles'),('Alfa','assistant'),('Ulubione','favorites')]:
              click(nodes,tab);nodes=dump('transport-'+key)
          start('PA6TubeActivity','--ez','kids','true')
          nodes=dump('tube-kids')
          assert any('Tube Kids' in n.get('text','') for n in nodes),'Tube Kids header missing'
          start('PA6SoundsActivity')
          nodes=dump('sounds-idle');click(nodes,'Odtwarzaj')
          assert 'value="true"' in adb('shell','cat','/data/data/'+package+'/shared_prefs/pa6_sounds.xml')
          adb('shell','input','keyevent','3');time.sleep(2)
          services=adb('shell','dumpsys','activity','services',package)
          Path('results/sounds-background.txt').write_text(services)
          assert 'PA6SoundsService' in services
          Path('results/audio-flinger.txt').write_text(adb('shell','dumpsys','media.audio_flinger'))
          adb('shell','am','startservice','-n',package+'/com.ispina.lokalnie.PA6SoundsService','-a','com.senikolo.pa6.SOUNDS_STOP');time.sleep(1)
          assert 'name="playing" value="false"' in adb('shell','cat','/data/data/'+package+'/shared_prefs/pa6_sounds.xml')
          # Exercise notification receiver with a real persisted reminder on this isolated emulator.
          start('PA6RemindersActivity');nodes=dump('reminder-empty')
          field=next(n for n in nodes if n.get('class')=='android.widget.EditText')
          x1,y1,x2,y2=map(int,re.findall(r'\d+',field.get('bounds')));adb('shell','input','tap',str((x1+x2)//2),str((y1+y2)//2))
          adb('shell','input','text','PA6_Postflight_Reminder');adb('shell','input','keyevent','4')
          nodes=dump('reminder-input');click(nodes,'Zapisz przypomnienie')
          prefs=ET.fromstring(adb('shell','cat','/data/data/'+package+'/shared_prefs/pa6_reminders.xml'))
          records=json.loads(next(n.text for n in prefs if n.get('name')=='items'));reminder=records[-1]
          adb('shell','am','broadcast','-n',package+'/com.ispina.lokalnie.PA6ReminderReceiver','-a','com.senikolo.pa6tablet.REMIND','--es','id',reminder['id'])
          time.sleep(1);notifications=adb('shell','dumpsys','notification','--noredact');Path('results/reminder-notification.txt').write_text(notifications)
          assert 'PA6_Postflight_Reminder' in notifications
          crash=adb('logcat','-d','-b','crash');Path('results/crashes.txt').write_text(crash)
          assert 'Process: '+package not in crash
          Path('results/status.txt').write_text('PASS rendered transport WebView and navigation / Tube Kids / sound start, background service and stop / persisted reminder delivered to NotificationManager\nAPK SHA256 '+hashlib.sha256(apk.read_bytes()).hexdigest()+'\n')
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86
          target: default
          profile: Nexus 10
          disable-animations: true
          emulator-boot-timeout: 700
          script: python3 /tmp/postflight.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PA6-2.4.2-Remaining-Module-Checks
          path: results
          retention-days: 45
