name: Build Pomocnik Alfa 1.7.25 Radio Metadata

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  build:
    if: ${{ github.event_name != 'issues' || github.event.issue.title == 'TRIGGER PA 1.7.25 RADIO META' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore verified 1.7.24 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir artifact project
          gh run download 37452119794 -R senikolo/Pomocnik-Alfa -n Pomocnik-Alfa-1.7.24-SOURCE -D artifact
          tar -xJf artifact/Pomocnik-Alfa-1.7.24-SOURCE.tar.xz -C project
          grep -n "versionCode 10724" project/app/build.gradle
          grep -n "onMediaMetadataChanged" project/app/src/main/java/com/ispina/lokalnie/radio/RadioService.java

      - name: Apply 1.7.25 metadata patch
        run: |
          set -euxo pipefail
          base64 -d patches/radio-metadata-1725.patch.gz.b64 | gzip -dc > /tmp/pa1725.patch
          cd project
          patch -p1 < /tmp/pa1725.patch
          grep -n "versionCode 10725" app/build.gradle
          grep -n "lastArtist" app/src/main/java/com/ispina/lokalnie/radio/RadioService.java
          grep -n "Audycja:" app/src/main/java/com/ispina/lokalnie/RadioActivity.java
          grep -n "refreshRadioSummary" app/src/main/java/com/ispina/lokalnie/MainActivity.java
          tar -cJf ../Pomocnik-Alfa-1.7.25-SOURCE.tar.xz .

      - name: Make side-by-side test package
        run: |
          set -euxo pipefail
          sed -i "s/applicationId 'com.senikolo.pomocniknowy'/applicationId 'com.senikolo.pomocniknowy.radio1725'/" project/app/build.gradle
          sed -i 's/android:label="Pomocnik Alfa"/android:label="Pomocnik Alfa RADIO 1.7.25"/' project/app/src/main/AndroidManifest.xml

      - name: Prepare Android SDK
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: project
        run: |
          set -euxo pipefail
          chmod +x gradlew
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          android.useAndroidX=true
          EOF
          ./gradlew --no-daemon assembleDebug -x lint --stacktrace
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" ../Pomocnik-Alfa-1.7.25-RADIO-METADATA.apk

      - name: Verify APK
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s Pomocnik-Alfa-1.7.25-RADIO-METADATA.apk
          "$BT/aapt" dump badging Pomocnik-Alfa-1.7.25-RADIO-METADATA.apk | head -3
          "$BT/apksigner" verify --verbose --print-certs Pomocnik-Alfa-1.7.25-RADIO-METADATA.apk
          sha256sum Pomocnik-Alfa-1.7.25-RADIO-METADATA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pomocnik-Alfa-1.7.25-RADIO-METADATA
          path: Pomocnik-Alfa-1.7.25-RADIO-METADATA.apk
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: Pomocnik-Alfa-1.7.25-SOURCE
          path: Pomocnik-Alfa-1.7.25-SOURCE.tar.xz
          retention-days: 3
