name: Repair PA 1.7.66 stable workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore proven PA 1.7.65 pipeline and apply stable release settings
        run: |
          set -euxo pipefail
          cp .github/workflows/build-1765-contrast-location-direction.yml .github/workflows/build-1766-audit-fixes-stable.yml
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/build-1766-audit-fixes-stable.yml')
          s=p.read_text(encoding='utf-8')
          def replace_once(old,new):
              global s
              count=s.count(old)
              if count != 1:
                  raise SystemExit(f'expected one occurrence, found {count}: {old[:80]!r}')
              s=s.replace(old,new)
          replace_once("""name: Build PA 1.7.65 HIGH CONTRAST PRECISE GPS DIRECTIONS TEST

          on:
            issues:
              types: [opened]
          """, """name: Build PA 1.7.66 Audit Fixes Stable
          on:
            workflow_dispatch:
          """)
          replace_once("""  contents: read
            actions: read
            issues: write
          """, """  contents: read
            actions: read
          """)
          replace_once("""  build:
              if: false
              runs-on: ubuntu-latest
          """, """  build:
              runs-on: ubuntu-latest
          """)
          replace_once("""p.write_text(s.replace(key, "applicationId 'com.senikolo.pomocniknowy.preview1765'"))""", """p.write_text(s.replace(key, "applicationId 'com.senikolo.pomocniknowy'"))""")
          replace_once("""          main.write_text(text.replace('POMOCNIK ALFA 1.7.64',
                      'POMOCNIK ALFA 1.7.65'),encoding='utf-8')
                    PY
                    grep -n "versionCode 10766" project/app/build.gradle
          """, """          main.write_text(text.replace('POMOCNIK ALFA 1.7.64',
                      'POMOCNIK ALFA 1.7.65'),encoding='utf-8')
                    PY
                    python - <<'PY'
                    from pathlib import Path
                    import re
                    gradle=Path('project/app/build.gradle')
                    text=gradle.read_text(encoding='utf-8')
                    assert 'versionCode 10766' in text
                    text=text.replace('versionCode 10766','versionCode 10767').replace("versionName '1.7.65-A10'","versionName '1.7.66-A10'")
                    gradle.write_text(text,encoding='utf-8')
                    main=Path('project/app/src/main/java/com/ispina/lokalnie/MainActivity.java')
                    text=main.read_text(encoding='utf-8')
                    assert 'POMOCNIK ALFA 1.7.65' in text
                    main.write_text(text.replace('POMOCNIK ALFA 1.7.65','POMOCNIK ALFA 1.7.66'),encoding='utf-8')
                    manifest=Path('project/app/src/main/AndroidManifest.xml')
                    text=manifest.read_text(encoding='utf-8')
                    text=re.sub(r'android:label="Pomocnik Alfa[^"]*"','android:label="Pomocnik Alfa 1.7.66"',text,count=1)
                    manifest.write_text(text,encoding='utf-8')
                    PY
                    grep -n "versionCode 10767" project/app/build.gradle
          """)
          for old,new in [
              ("s/versionCode 10763/versionCode 10766/", "s/versionCode 10763/versionCode 10767/"),
              ("s/versionCode 10762/versionCode 10766/", "s/versionCode 10762/versionCode 10767/"),
              ("s/versionCode 10764/versionCode 10766/", "s/versionCode 10764/versionCode 10767/"),
              ("s/versionCode 10765/versionCode 10766/", "s/versionCode 10765/versionCode 10767/"),
              ("s/1.7.64-A10/1.7.65-A10/", "s/1.7.64-A10/1.7.66-A10/"),
              ("assert 'POMOCNIK ALFA 1.7.65' in Path('project/app/src/main/java/com/ispina/lokalnie/MainActivity.java').read_text()", "assert 'POMOCNIK ALFA 1.7.66' in Path('project/app/src/main/java/com/ispina/lokalnie/MainActivity.java').read_text()"),
          ]:
              replace_once(old,new)
          idx=s.index('      - name: Build signed test APK')
          tail="""      - name: Build unsigned release APK
                  working-directory: project
                  run: |
                    set -euxo pipefail
                    chmod +x gradlew
                    ./gradlew --no-daemon assembleRelease -x lint --stacktrace
                    APK="$(find app/build/outputs/apk/release -name '*unsigned.apk' | head -1)"
                    test -n "$APK" -a -s "$APK"
                    cp "$APK" ../Pomocnik-Alfa-1.7.66-A10-AUDIT-FIXES-UNSIGNED.apk

                - name: Verify package content
                  run: |
                    set -euxo pipefail
                    BT="$ANDROID_HOME/build-tools/35.0.0"
                    "$BT/aapt" dump badging Pomocnik-Alfa-1.7.66-A10-AUDIT-FIXES-UNSIGNED.apk | tee badging.txt
                    grep "package: name='com.senikolo.pomocniknowy'" badging.txt
                    grep "versionCode='10767'" badging.txt
                    grep "sdkVersion:'29'" badging.txt
                    unzip -t Pomocnik-Alfa-1.7.66-A10-AUDIT-FIXES-UNSIGNED.apk >/dev/null
                    unzip -l Pomocnik-Alfa-1.7.66-A10-AUDIT-FIXES-UNSIGNED.apk | grep -E '(warsaw-directions.tsv|warsaw-directions.tsv.gz)'
                    unzip -l Pomocnik-Alfa-1.7.66-A10-AUDIT-FIXES-UNSIGNED.apk | grep -E '(mld-directions.tsv|mld-directions.tsv.gz)'
                    unzip -l Pomocnik-Alfa-1.7.66-A10-AUDIT-FIXES-UNSIGNED.apk | grep -F 'assets/pa_gtfs/warsaw-gps-paths.idx'
                    sha256sum Pomocnik-Alfa-1.7.66-A10-AUDIT-FIXES-UNSIGNED.apk

                - uses: actions/upload-artifact@v4
                  with:
                    name: Pomocnik-Alfa-1.7.66-A10-AUDIT-FIXES-UNSIGNED
                    path: Pomocnik-Alfa-1.7.66-A10-AUDIT-FIXES-UNSIGNED.apk
                    retention-days: 30

            sign:
              needs: build
              uses: ./.github/workflows/stable-sign-pa.yml
              with:
                artifact_name: Pomocnik-Alfa-1.7.66-A10-AUDIT-FIXES-UNSIGNED
                output_name: Pomocnik-Alfa-1.7.66-A10-AUDIT-FIXES-STABLE.apk
              secrets: inherit
          """
          s=s[:idx]+tail
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-1766-audit-fixes-stable.yml
          git commit -m 'Restore verified PA 1.7.66 stable build workflow'
          git push
