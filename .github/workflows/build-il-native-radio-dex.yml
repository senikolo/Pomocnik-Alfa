name: Build IL Native Radio Dex

on:
  workflow_dispatch:
  push:
    paths:
      - 'helpers/il-radio-18295/**'
      - 'triggers/build-il-native-radio-dex.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile dex
        run: |
          set -euxo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          mkdir -p out/classes out/dex
          javac --release 8 -cp "$ANDROID_JAR" -d out/classes             helpers/il-radio-18295/RadioService.java             helpers/il-radio-18295/RadioNowPlaying.java             helpers/il-radio-18295/RadioCommandActivity.java
          jar cf out/radio-classes.jar -C out/classes .
          "$ANDROID_HOME/build-tools/35.0.0/d8" --release --min-api 23 --lib "$ANDROID_JAR" --output out/dex out/radio-classes.jar
          test -s out/dex/classes.dex
          cp out/dex/classes.dex out/classes6.dex
          sha256sum out/classes6.dex
      - uses: actions/upload-artifact@v4
        with:
          name: IL-NATIVE-RADIO-DEX-18295
          path: out/classes6.dex
          retention-days: 7
