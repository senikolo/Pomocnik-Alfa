name: PA14 ekonomia i niemiecki TEST
on:
  workflow_dispatch:
  push:
    branches: ['work/pa14-economy-search-20261027']
    paths: ['.github/workflows/pa2-alpha10-preview.yml', 'helpers/pa2/**']
env:
  PA_TRIAL_ID: com.senikolo.pomocniknowy.pa14economysearchtest.r${{ github.run_id }}
defaults:
  run:
    shell: bash
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore existing full PA base
        run: |
          mkdir -p baseline tools output
          if gh release download pa2-source-base -p pa-base.zip -D baseline; then
            unzip -q baseline/pa-base.zip -d baseline
          else
            gh run download 37921731880 -n Pomocnik-Alfa-1.7.66-A10-AUDIT-FIXES-UNSIGNED -D baseline
          fi
          find baseline -name '*.apk' -print -quit | xargs -I{} cp '{}' baseline.apk
          test -s baseline.apk
          sha256sum baseline.apk > output/base-sha256.txt
          gh release download v2.12.1 -R iBotPeaches/Apktool -p apktool_2.12.1.jar -D tools
      - name: Prepare app data and local assets
        run: |
          python3 helpers/pa2/fetch_data.py feeds
          python3 helpers/pa2/build_data.py feeds build/data
          python3 helpers/pa2/enrich_radio_catalog.py helpers/pa2/radio_catalog.json
      - name: Rebuild the full app with the economy and German modules
        run: |
          java -Xmx4g -jar tools/apktool_2.12.1.jar d -f -o decoded baseline.apk
          python3 helpers/pa2/patch_antyradio.py decoded
          python3 helpers/pa2/patch_project.py decoded build/data
          python3 helpers/pa2/patch_economy.py decoded
          python3 helpers/pa2/patch_radio_catalog.py decoded
          python3 - <<'PY'
          from pathlib import Path
          p=Path('decoded/AndroidManifest.xml')
          text=p.read_text()
          original='com.senikolo.pomocniknowy.pa2preview'
          import os
          trial=os.environ['PA_TRIAL_ID']
          assert f'package="{original}"' in text, 'Unexpected base app identity'
          text=text.replace(original,trial).replace('Pomocnik Alfa ULTRASMART 10','Pomocnik Alfa 14 TEST - Tańsze oferty')
          assert f'package="{trial}"' in text and original not in text
          p.write_text(text)
          PY
          node helpers/pa2/prepare_js.cjs decoded/assets/pa_regions
          SDK="$ANDROID_HOME"
          mkdir -p classes native
          javac -source 8 -target 8 -encoding UTF-8 -cp "$SDK/platforms/android-35/android.jar" -d classes helpers/pa2/*.java
          find classes -name '*.class' -print0 | xargs -0 "$SDK/build-tools/35.0.0/d8" --min-api 29 --lib "$SDK/platforms/android-35/android.jar" --output native
          java -Xmx4g -jar tools/apktool_2.12.1.jar b decoded -o output/rebuilt.apk
          cp native/classes.dex output/classes5.dex
          (cd output && zip -q -0 rebuilt.apk classes5.dex)
          "$SDK/build-tools/35.0.0/zipalign" -p -f 4 output/rebuilt.apk output/aligned.apk
      - name: Sign APK and verify package metadata
        run: |
          set -euo pipefail
          umask 077
          export TRIAL_PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -keyalg RSA -keysize 3072 -sigalg SHA256withRSA -validity 3650 -alias pa14-economy-trial -dname 'CN=PA14 economy test, O=PA testing' -storetype PKCS12 -keystore "$RUNNER_TEMP/pa14economytest.p12" -storepass:env TRIAL_PASS -keypass:env TRIAL_PASS >/dev/null 2>&1
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK=output/Pomocnik-Alfa-PA14-Ekonomia-i-Niemiecki-TEST.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/pa14economytest.p12" --ks-type PKCS12 --ks-key-alias pa14-economy-trial --ks-pass env:TRIAL_PASS --key-pass env:TRIAL_PASS --out "$APK" output/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs "$APK" > output/signature.txt
          "$BT/aapt" dump badging "$APK" > output/badging.txt
          grep -q "package: name='$PA_TRIAL_ID'" output/badging.txt
          ! grep -q "package: name='com.senikolo.pomocniknowy.pa2preview'" output/badging.txt
          sha256sum "$APK" > output/SHA256SUMS.txt
          rm -f "$RUNNER_TEMP/pa14economytest.p12"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PA14-economy-search-isolated-signed-apk
          path: |
            output/Pomocnik-Alfa-PA14-Ekonomia-i-Niemiecki-TEST.apk
            output/SHA256SUMS.txt
            output/signature.txt
            output/badging.txt
          retention-days: 60
