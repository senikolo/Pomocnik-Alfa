name: PA18 Android 11 TV diagnostics
on:
  push:
    branches: ['work/pa18-tv-recording-progress-20261127']
    paths: ['.github/workflows/pa2-alpha10-preview.yml']
permissions:
  contents: read
  actions: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      PA17_PACKAGE: com.senikolo.pomocniknowy.pa17recordingtest.r46053183073
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the signed PA17 release
        run: |
          mkdir -p old results
          gh run download 46053183073 -n PA17-recordings-isolated-signed-apk -D old
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Reproduce PA17 TV crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 360
          script: |
            adb root
            adb wait-for-device
            adb install -r old/Pomocnik-Alfa-PA17-NAGRYWANIE-TEST.apk
            adb shell input keyevent 82
            adb logcat -c
            adb shell am start -W -n "$PA17_PACKAGE/com.ispina.lokalnie.TvActivity" | tee results/launch.txt
            sleep 8
            adb logcat -d -b crash | tee results/crash.txt
            adb logcat -d -s AndroidRuntime ActivityTaskManager art | tail -250 > results/runtime.txt
            adb shell uiautomator dump /data/local/tmp/pa-tv.xml
            adb pull /data/local/tmp/pa-tv.xml results/pa-tv.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PA17-TV-diagnosis
          path: results
