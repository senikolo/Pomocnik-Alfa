name: Build Pomocnik Alfa 1.7.28 Polish Radio API

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  build:
    if: ${{ github.event_name != 'issues' || github.event.issue.title == 'TRIGGER PA 1.7.28 POLSKIE RADIO API' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Audit all 24 radio streams
        run: |
          cat > /tmp/audit.py <<'PY'
          import urllib.request,re
          stations=[
          ("PR1","https://stream11.polskieradio.pl/pr1/pr1.sdp/playlist.m3u8"),("PR3","https://stream13.polskieradio.pl/pr3/pr3.sdp/playlist.m3u8"),("TOK FM","https://radiostream.pl/tuba10-1.mp3"),("ESKA Bochnia","https://ic1.smcdn.pl/2330-1.mp3"),("RMF FM","https://rs103-krk-cyfronet.rmfstream.pl/RMFFM48"),("Radio ZET","https://zt02.cdn.eurozet.pl/zet-old.mp3"),("VOX FM","https://ic2.smcdn.pl/3990-1.mp3"),("RMF Classic","https://rs9-krk2.rmfstream.pl/rmf_classic"),("RMF MAXX","https://rs9-krk2-cyfronet.rmfstream.pl/RMFMAXXX48"),("Złote Przeboje","https://radiostream.pl/tuba8904-1.mp3"),("Radio Pogoda","https://hub.radiostream.pl/stream.pls?radio=38&type=none&app=none&coding=mp3&redirect=true"),("Eska2","https://waw.ic.smcdn.pl/6040-1.aac"),("Eska ROCK","https://n07-eu.rcs.revma.com/1nnezw8qz7zuv"),("1.FM Birds","https://strm112.1.fm/brazilianbirds_mobile_mp3"),("Arabella","https://edge21.stream.radioarabella.de/radioarabella-muenchen/stream/mp3"),("Antenne Bayern","https://stream.antenne.de/antenne/stream/mp3"),("Bayern 2","https://dispatcher.rndfnk.com/br/br2/live/mp3/mid"),("Bayern 3","https://dispatcher.rndfnk.com/br/br3/live/mp3/mid"),("Deutschlandfunk","https://st01.sslstream.dlf.de/dlf/01/low/aac/stream.aac?aggregator=web"),("ROCK ANTENNE","https://stream.rockantenne.de/rockantenne/stream/mp3"),("BR24","https://dispatcher.rndfnk.com/br/br24/live/mp3/mid"),("BR-KLASSIK","https://dispatcher.rndfnk.com/br/brklassik/live/mp3/mid"),("BR Heimat","https://dispatcher.rndfnk.com/br/brheimat/live/mp3/mid"),("DLF Kultur","https://st02.sslstream.dlf.de/dlf/02/low/aac/stream.aac?aggregator=web")]
          def probe(n,u):
            if '.m3u8' in u:return ('HLS','')
            try:
              q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Icy-MetaData':'1'})
              with urllib.request.urlopen(q,timeout=7) as r:
                h={k.lower():v for k,v in r.headers.items()}; mi=int(h.get('icy-metaint','0') or 0)
                if not mi:return ('NO-ICY',h.get('icy-name',''))
                left=mi
                while left:
                  b=r.read(min(left,32768))
                  if not b:break
                  left-=len(b)
                z=r.read(1)
                if not z:return ('ICY','no-block')
                raw=r.read(z[0]*16).decode('latin1','ignore').replace(chr(0),'')
                m=re.search(r"StreamTitle=['\"]([^'\"]*)",raw,re.I)
                return ('ICY',(m.group(1).strip() if m else raw.strip())[:140])
            except Exception as e:return ('ERR',str(e)[:100])
          for n,u in stations:
            a,b=probe(n,u); print('AUDIT|%s|%s|%s'%(n,a,b.replace('|','/')))
          PY
          python /tmp/audit.py

      - name: Verify Polskie Radio API
        run: |
          set -euxo pipefail
          HDR=(-H 'Accept: application/json, text/plain, */*' -H 'Origin: https://player.polskieradio.pl' -H 'Referer: https://player.polskieradio.pl/' -A 'Mozilla/5.0')
          curl -fsSL --retry 2 "${HDR[@]}" 'https://apipr.polskieradio.pl/api/schedule?Program=1' -o /tmp/pr1.json
          curl -fsSL --retry 2 "${HDR[@]}" 'https://apipr.polskieradio.pl/api/schedule?Program=3' -o /tmp/pr3.json
          python - <<'PY'
          import json
          for path in ('/tmp/pr1.json','/tmp/pr3.json'):
              data=json.load(open(path,encoding='utf-8'))
              rows=data.get('Schedule') or []
              assert rows, f'Brak Schedule w {path}'
              assert any((r.get('Title') or '').strip() for r in rows), f'Brak tytułów w {path}'
              print(path, 'OK', len(rows))
          PY

      - name: Restore verified 1.7.27 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir artifact project
          gh run download 37468498855 -R senikolo/Pomocnik-Alfa -n Pomocnik-Alfa-1.7.27-SOURCE -D artifact
          tar -xJf artifact/Pomocnik-Alfa-1.7.27-SOURCE.tar.xz -C project
          grep -n "versionCode 10727" project/app/build.gradle

      - name: Apply Polish Radio API patch
        run: |
          set -euxo pipefail
          base64 -d patches/radio-polskie-api-1728.patch.gz.b64 | gzip -dc > /tmp/pa1728.patch
          cd project
          patch -p0 < /tmp/pa1728.patch
          grep -n "versionCode 10728" app/build.gradle
          grep -n "fetchPolskieRadioApi(1" app/src/main/java/com/ispina/lokalnie/radio/RadioInfoPlus.java
          grep -n "fetchPolskieRadioApi(3" app/src/main/java/com/ispina/lokalnie/radio/RadioInfoPlus.java
          grep -n "apipr.polskieradio.pl/api/schedule" app/src/main/java/com/ispina/lokalnie/radio/RadioInfoPlus.java
          tar -cJf ../Pomocnik-Alfa-1.7.28-SOURCE.tar.xz .

      - name: Make side-by-side test package
        run: |
          set -euxo pipefail
          sed -i "s/applicationId 'com.senikolo.pomocniknowy'/applicationId 'com.senikolo.pomocniknowy.radio1728'/" project/app/build.gradle
          sed -i 's/android:label="Pomocnik Alfa"/android:label="Pomocnik Alfa RADIO API 1.7.28"/' project/app/src/main/AndroidManifest.xml

      - name: Prepare Android SDK
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: project
        run: |
          set -euxo pipefail
          chmod +x gradlew
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          android.useAndroidX=true
          EOF
          ./gradlew --no-daemon assembleDebug -x lint --stacktrace
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" ../Pomocnik-Alfa-1.7.28-POLSKIE-RADIO-API.apk

      - name: Verify APK
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s Pomocnik-Alfa-1.7.28-POLSKIE-RADIO-API.apk
          "$BT/aapt" dump badging Pomocnik-Alfa-1.7.28-POLSKIE-RADIO-API.apk | head -3
          "$BT/apksigner" verify --verbose --print-certs Pomocnik-Alfa-1.7.28-POLSKIE-RADIO-API.apk
          sha256sum Pomocnik-Alfa-1.7.28-POLSKIE-RADIO-API.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pomocnik-Alfa-1.7.28-POLSKIE-RADIO-API
          path: Pomocnik-Alfa-1.7.28-POLSKIE-RADIO-API.apk
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: Pomocnik-Alfa-1.7.28-SOURCE
          path: Pomocnik-Alfa-1.7.28-SOURCE.tar.xz
          retention-days: 3
