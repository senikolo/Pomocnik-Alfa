name: Build PA 1.7.66 Audit Fixes Stable
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Rebuild audited PA source
        run: |
          set -euxo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import base64
          import gzip
          blob = ''
          full = gzip.decompress(base64.b64decode(blob)).decode('utf-8')
          def extract(label, target):
              marker = '      - name: ' + label + '\n'
              at = full.index(marker)
              run_marker = '        run: |\n'
              start = full.index(run_marker, at) + len(run_marker)
              end = full.find('\n      - ', start)
              if end < 0:
                  raise SystemExit('next step not found: ' + label)
              body = full[start:end]
              lines = []
              for line in body.splitlines():
                  if not line.strip():
                      lines.append('')
                  elif line.startswith('          '):
                      lines.append(line[10:])
                  else:
                      raise SystemExit('bad indentation in ' + label + ': ' + repr(line[:20]))
              Path(target).write_text('\n'.join(lines) + '\n', encoding='utf-8')
          extract('Restore current source', '/tmp/pa-restore.sh')
          extract('Apply latest reader, radio and precise opt-in GPS', '/tmp/pa-apply.sh')
          extract('Android SDK', '/tmp/pa-sdk.sh')
          extract('Static audit smoke tests', '/tmp/pa-audit.sh')
          extract('Build unsigned release APK', '/tmp/pa-build.sh')
          extract('Verify package content', '/tmp/pa-verify.sh')
          PY2
          bash /tmp/pa-restore.sh
          bash /tmp/pa-apply.sh
          # The 1.7.65 regression suite is reused for 1.7.66.
          # Keep its feature assertions, but verify the current versionCode.
          TEST_FILE=helpers/pa-1765/test_accessibility_directions.py
          grep -q 'assert "versionCode 10766"' "$TEST_FILE"
          sed -i 's/assert "versionCode 10766"/assert "versionCode 10767"/' "$TEST_FILE"
          grep -q 'assert "versionCode 10767"' "$TEST_FILE"
          bash /tmp/pa-sdk.sh
          export ANDROID_HOME=/usr/local/lib/android/sdk
          bash /tmp/pa-audit.sh
          (cd project && bash /tmp/pa-build.sh)
          bash /tmp/pa-verify.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Pomocnik-Alfa-1.7.66-A10-AUDIT-FIXES-UNSIGNED
          path: Pomocnik-Alfa-1.7.66-A10-AUDIT-FIXES-UNSIGNED.apk
          retention-days: 30

  sign:
    needs: build
    uses: ./.github/workflows/stable-sign-pa.yml
    with:
      artifact_name: Pomocnik-Alfa-1.7.66-A10-AUDIT-FIXES-UNSIGNED
      output_name: Pomocnik-Alfa-1.7.66-A10-AUDIT-FIXES-STABLE.apk
    secrets: inherit
