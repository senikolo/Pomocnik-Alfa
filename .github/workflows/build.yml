name: Build Pomocnik Alfa 1.7.6

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Pomocnik Alfa 1.7.6 source
        run: |
          curl -fL --retry 3 --retry-delay 2             "https://f366ae4b-1478-4dc8-b5e5-0c4f287fe888.sandbox.floot.app/_cdn/static/fd5b8279-7d4e-46b8-bd1b-07a1c43275dd-Pomocnik-Alfa-1.7.6-kod.tar.xz"             -o source.tar.xz
          tar -xJf source.tar.xz

      - name: Restore bundled Ispina Lokalnie APK
        run: |
          curl -fL --retry 3 --retry-delay 2             "https://f366ae4b-1478-4dc8-b5e5-0c4f287fe888.sandbox.floot.app/_cdn/static/f986c4e3-be4d-4544-9495-9871b4b6caf6-Ispina-Lokalnie-1.82.35.apk.xz"             -o ispina.apk.xz
          mkdir -p app/src/main/res/raw
          xz -dc ispina.apk.xz > app/src/main/res/raw/ispina_lokalnie_1_82_35.apk

      - name: Restore original storm recording
        run: |
          mkdir -p app/src/main/assets/audio
          curl -fL --retry 3 --retry-delay 2             "https://f366ae4b-1478-4dc8-b5e5-0c4f287fe888.sandbox.floot.app/_cdn/static/92fcd483-2598-48eb-af2c-02c83fd88b7b-storm.pcm"             -o app/src/main/assets/audio/storm.pcm

      - name: Verify version and restored assets
        run: |
          grep -n "versionCode 10706" app/build.gradle
          grep -n "versionName '1.7.6'" app/build.gradle
          test -s app/src/main/res/raw/ispina_lokalnie_1_82_35.apk
          test -s app/src/main/assets/audio/storm.pcm
          ls -lh app/src/main/res/raw/ispina_lokalnie_1_82_35.apk app/src/main/assets/audio/storm.pcm

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Pomocnik-Alfa-1.7.6-ALFA-TUBE-ERGONOMIA.apk
          sha256sum Pomocnik-Alfa-1.7.6-ALFA-TUBE-ERGONOMIA.apk
          ls -lh Pomocnik-Alfa-1.7.6-ALFA-TUBE-ERGONOMIA.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pomocnik-Alfa-1.7.6-ALFA-TUBE-ERGONOMIA
          path: Pomocnik-Alfa-1.7.6-ALFA-TUBE-ERGONOMIA.apk
          if-no-files-found: error
          retention-days: 7
