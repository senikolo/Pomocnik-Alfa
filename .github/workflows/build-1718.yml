name: Build Pomocnik Alfa 1.7.18

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  build:
    if: ${{ github.event_name != 'issues' || github.event.issue.title == 'TRIGGER PA 1.7.18 BUILD' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore verified 1.7.17 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir artifact project
          gh run download 37425736663 -n Pomocnik-Alfa-1.7.17-SOURCE -D artifact
          tar -xJf artifact/Pomocnik-Alfa-1.7.17-SOURCE.tar.xz -C project
          test -f project/app/build.gradle
          grep -n "versionCode 10717" project/app/build.gradle

      - name: Apply 1.7.18 proposal cache and mobile download fix
        run: |
          set -euxo pipefail
          base64 -d patches/alfa-tube-1718.patch.gz.b64 > /tmp/pa1718.patch.gz
          gzip -dc /tmp/pa1718.patch.gz > /tmp/pa1718.patch
          cd project
          patch -p1 < /tmp/pa1718.patch
          grep -n "versionCode 10718" app/build.gradle
          grep -n "versionName '1.7.18'" app/build.gradle
          grep -n "homeSuggestions" app/src/main/java/com/ispina/lokalnie/TubeActivity.java
          grep -n "NETWORK_MOBILE" app/src/main/java/com/ispina/lokalnie/tube/TubeDownloads.java
          grep -n "POMOCNIK ALFA 1.7.18" app/src/main/java/com/ispina/lokalnie/MainActivity.java

      - name: Prepare Android SDK
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Build release APK
        working-directory: project
        run: |
          set -euxo pipefail
          chmod +x gradlew
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          android.useAndroidX=true
          EOF
          ./gradlew --no-daemon assembleRelease -x lintVitalRelease --stacktrace
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" ../Pomocnik-Alfa-1.7.18-UNSIGNED.apk

      - name: Verify APK
        run: |
          set -euxo pipefail
          test -s Pomocnik-Alfa-1.7.18-UNSIGNED.apk
          /usr/local/lib/android/sdk/build-tools/35.0.0/aapt dump badging Pomocnik-Alfa-1.7.18-UNSIGNED.apk | head -3
          sha256sum Pomocnik-Alfa-1.7.18-UNSIGNED.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pomocnik-Alfa-1.7.18-UNSIGNED
          path: Pomocnik-Alfa-1.7.18-UNSIGNED.apk
          retention-days: 7

      - name: Upload source
        run: tar -cJf Pomocnik-Alfa-1.7.18-SOURCE.tar.xz -C project .

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pomocnik-Alfa-1.7.18-SOURCE
          path: Pomocnik-Alfa-1.7.18-SOURCE.tar.xz
          retention-days: 3
