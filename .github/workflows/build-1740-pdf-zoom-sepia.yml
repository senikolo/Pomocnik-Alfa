name: Build Pomocnik Alfa 1.7.40 PDF Zoom Sepia

on:
  workflow_dispatch:
  push:
    paths:
      - 'triggers/build-1740-pdf-zoom-sepia.txt'
      - 'helpers/czytnik-alfa/patch_modern_reader.py'
      - 'helpers/czytnik-alfa/patch_fullscreen_reader.py'
      - 'helpers/czytnik-alfa/patch_pdf_zoom_sepia.py'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Pomocnik Alfa 1.7.36 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir artifact
          gh run download 37574069132 -R senikolo/Pomocnik-Alfa -n Pomocnik-Alfa-1.7.36-CZYTNIK-ALFA-SOURCE -D artifact
          tar -xJf artifact/Pomocnik-Alfa-1.7.36-CZYTNIK-ALFA-SOURCE.tar.xz
          test -d project

      - name: Apply modern reader fullscreen and PDF zoom
        run: |
          set -euxo pipefail
          python helpers/czytnik-alfa/patch_modern_reader.py
          python helpers/czytnik-alfa/patch_fullscreen_reader.py
          python helpers/czytnik-alfa/patch_pdf_zoom_sepia.py
          grep -n "PdfZoomImageView" project/app/src/main/java/com/ispina/lokalnie/ReaderActivity.java
          grep -n "applyPdfTheme" project/app/src/main/java/com/ispina/lokalnie/ReaderActivity.java
          grep -n "zoom " project/app/src/main/java/com/ispina/lokalnie/ReaderActivity.java
          grep -n "versionCode 10740" project/app/build.gradle
          grep -n "minSdk 29" project/app/build.gradle

      - name: Prepare Android SDK
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Build Android 10+ APK
        working-directory: project
        run: |
          set -euxo pipefail
          chmod +x gradlew
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          ./gradlew --no-daemon assembleDebug -x lint --stacktrace
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" ../Pomocnik-Alfa-1.7.40-ANDROID10-PDF-ZOOM-SEPIA-UNSIGNED.apk
          cd ..
          stat -c '%n %s bytes' Pomocnik-Alfa-1.7.40-ANDROID10-PDF-ZOOM-SEPIA-UNSIGNED.apk

      - name: Verify APK
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt" dump badging Pomocnik-Alfa-1.7.40-ANDROID10-PDF-ZOOM-SEPIA-UNSIGNED.apk | head -6
          "$BT/aapt" dump badging Pomocnik-Alfa-1.7.40-ANDROID10-PDF-ZOOM-SEPIA-UNSIGNED.apk | grep "package: name='com.senikolo.pomocniknowy'"
          "$BT/aapt" dump badging Pomocnik-Alfa-1.7.40-ANDROID10-PDF-ZOOM-SEPIA-UNSIGNED.apk | grep "versionCode='10740'"
          "$BT/aapt" dump badging Pomocnik-Alfa-1.7.40-ANDROID10-PDF-ZOOM-SEPIA-UNSIGNED.apk | grep "sdkVersion:'29'"
          unzip -t Pomocnik-Alfa-1.7.40-ANDROID10-PDF-ZOOM-SEPIA-UNSIGNED.apk >/dev/null
          sha256sum Pomocnik-Alfa-1.7.40-ANDROID10-PDF-ZOOM-SEPIA-UNSIGNED.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pomocnik-Alfa-1.7.40-ANDROID10-PDF-ZOOM-SEPIA-UNSIGNED
          path: Pomocnik-Alfa-1.7.40-ANDROID10-PDF-ZOOM-SEPIA-UNSIGNED.apk
          retention-days: 7
