name: PA 2.0 UX alpha.2 source build
on:
  workflow_dispatch:
  push:
    branches: ['work/pa2-ux-alpha2-20261015']
    paths: ['helpers/pa2/**', '.github/workflows/pa2-alpha.yml']
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore existing full PA base without dropping modules
        run: |
          mkdir -p baseline tools output
          if gh release download pa2-source-base -p pa-base.zip -D baseline; then
            unzip -q baseline/pa-base.zip -d baseline
          else
            gh run download 37921731880 -n Pomocnik-Alfa-1.7.66-A10-AUDIT-FIXES-UNSIGNED -D baseline
          fi
          find baseline -name '*.apk' -print -quit | xargs -I{} cp '{}' baseline.apk
          test -s baseline.apk
          sha256sum baseline.apk > output/base-sha256.txt
          gh release download v2.12.1 -R iBotPeaches/Apktool -p apktool_2.12.1.jar -D tools
      - name: Fetch real eight-source transport coverage and validate calendars
        run: |
          python3 helpers/pa2/fetch_data.py feeds
          python3 helpers/pa2/build_data.py feeds build/data | tee output/data-build.txt
          TZ=Europe/Warsaw node helpers/pa2/test.cjs build/data | tee output/logic-tests.txt
          python3 -m py_compile helpers/pa2/*.py
          python3 helpers/pa2/test_data.py
          node --check helpers/pa2/backend/worker.mjs
          node --check helpers/pa2/app.js
          node --check helpers/pa2/conversation.js
      - name: Rebuild existing project and new native module
        run: |
          java -Xmx4g -jar tools/apktool_2.12.1.jar d -f -o decoded baseline.apk
          python3 helpers/pa2/patch_project.py decoded build/data
          node helpers/pa2/prepare_js.cjs decoded/assets/pa_regions
          SDK="$ANDROID_HOME"
          mkdir -p classes native
          javac -source 8 -target 8 -encoding UTF-8 -cp "$SDK/platforms/android-35/android.jar" -d classes helpers/pa2/*.java
          mkdir -p live-test-src live-test-classes
          cp helpers/pa2/PALiveTest.java.test live-test-src/PALiveTest.java
          javac -cp "classes:$SDK/platforms/android-35/android.jar" -d live-test-classes live-test-src/PALiveTest.java
          java -cp "classes:live-test-classes:$SDK/platforms/android-35/android.jar" com.ispina.lokalnie.PALiveTest | tee output/live-tests.txt
          find classes -name '*.class' -print0 | xargs -0 "$SDK/build-tools/35.0.0/d8" --min-api 29 --lib "$SDK/platforms/android-35/android.jar" --output native
          java -Xmx4g -jar tools/apktool_2.12.1.jar b decoded -o output/rebuilt.apk
          cp native/classes.dex output/classes5.dex
          (cd output && zip -q -0 rebuilt.apk classes5.dex)
          "$SDK/build-tools/35.0.0/zipalign" -p -f 4 output/rebuilt.apk output/aligned.apk
      - name: Export aligned APK for one-time external preview signing
        run: |
          cp output/aligned.apk output/PA2-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging output/PA2-aligned-unsigned.apk > output/badging.txt
          sha256sum output/PA2-aligned-unsigned.apk > output/SHA256-unsigned.txt
      - name: Compile instrumentation for the same preview target
        run: |
          mkdir -p testsrc testclasses testdex
          cp helpers/pa2/PAProbe.java.test testsrc/PAProbe.java
          cp helpers/pa2/test-manifest.xml testsrc/AndroidManifest.xml
          javac -source 8 -target 8 -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d testclasses testsrc/PAProbe.java
          find testclasses -name '*.class' -print0 | xargs -0 "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 29 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output testdex
          "$ANDROID_HOME/build-tools/35.0.0/aapt" package -f -M testsrc/AndroidManifest.xml -I "$ANDROID_HOME/platforms/android-35/android.jar" -F output/test-raw.apk
          (cd testdex && zip -q -0 ../output/test-raw.apk classes.dex)
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 output/test-raw.apk output/test-aligned.apk
          cp output/test-aligned.apk output/PA2-instrumentation-unsigned.apk
      - name: Sign separately installable PA2 UX alpha.2 test APK
        run: |
          keytool -genkeypair -noprompt -keystore output/pa2ux-temp.jks -storepass alpha2Preview2026 -keypass alpha2Preview2026 -alias testpreview -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=PA2 UX Test,OU=Development,O=Pomocnik Alfa,C=PL"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks output/pa2ux-temp.jks --ks-key-alias testpreview --ks-pass pass:alpha2Preview2026 --key-pass pass:alpha2Preview2026 --out output/Pomocnik-Alfa-2.0.0-alpha.2-UX-TEST.apk output/PA2-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks output/pa2ux-temp.jks --ks-key-alias testpreview --ks-pass pass:alpha2Preview2026 --key-pass pass:alpha2Preview2026 --out output/PA2-UX-instrumentation.apk output/PA2-instrumentation-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose output/Pomocnik-Alfa-2.0.0-alpha.2-UX-TEST.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging output/Pomocnik-Alfa-2.0.0-alpha.2-UX-TEST.apk > output/ux-badging.txt
          grep -q 'com.senikolo.pomocniknowy.pa2uxpreview' output/ux-badging.txt
          sha256sum output/Pomocnik-Alfa-2.0.0-alpha.2-UX-TEST.apk > output/PA2-UX-SHA256.txt
          rm output/pa2ux-temp.jks
      - name: Preserve complete reconstructed project and updateable data
        run: |
          cp -r helpers/pa2 decoded/pa2-build-sources
          cp -r native decoded/pa2-native-dex
          (cd decoded && zip -q -r ../output/PA2-Reconstructed-Project.zip . -x 'build/*' 'dist/*')
          (cd build/data && zip -q -r ../../output/pa2-data.zip .)
          cp baseline.apk pa-base.apk
          zip -q output/pa-base.zip pa-base.apk
          gh release view pa2-source-base >/dev/null 2>&1 || gh release create pa2-source-base --prerelease --title 'PA: archiwum bazy projektu do odtworzenia kompilacji' --notes 'Techniczna baza pełnej aplikacji. Nie jest wydaniem dla użytkowników.'
          gh release upload pa2-source-base output/pa-base.zip --clobber
          gh release view pa2-data >/dev/null 2>&1 || gh release create pa2-data --prerelease --title 'Aktualizacje danych Planera PA 2.0' --notes 'Dane GTFS przetworzone z datami ważności. Źródła i uznanie autorstwa w paczce.'
          gh release upload pa2-data output/pa2-data.zip --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PA2-unsigned-build
          path: |
            output/PA2-aligned-unsigned.apk
            output/Pomocnik-Alfa-2.0.0-alpha.2-UX-TEST.apk
            output/PA2-UX-instrumentation.apk
            output/PA2-instrumentation-unsigned.apk
            output/PA2-Reconstructed-Project.zip
            output/*.txt
          retention-days: 60

  android:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 36
    strategy:
      fail-fast: false
      matrix:
        api: [29,30]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PA2-unsigned-build
          path: build
      - name: Enable hardware emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write bounded real-device-test script
        run: |
          cat > pa2-ux-smoke.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p results
          adb install -r build/Pomocnik-Alfa-2.0.0-alpha.2-UX-TEST.apk
          adb install -r build/PA2-UX-instrumentation.apk
          adb logcat -c
          set +e
          timeout 300s adb shell am instrument -w com.senikolo.pa2test/com.senikolo.pa2test.PAProbe > results/instrumentation.txt 2>&1
          TEST_RESULT=$?
          set -e
          cat results/instrumentation.txt
          adb logcat -d -b crash > results/crashes.txt
          adb logcat -d -s AndroidRuntime:E > results/runtime-errors.txt
          adb pull /sdcard/Android/data/com.senikolo.pomocniknowy.pa2uxpreview/files/pa2-tests results/screenshots || true
          test "$TEST_RESULT" -eq 0
          grep -q 'TOTAL PASS system' results/instrumentation.txt
          test ! -s results/crashes.txt || ! grep -q 'FATAL EXCEPTION' results/crashes.txt
          BASH
      - name: Check signed APK and preserved modules on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 700
          script: bash pa2-ux-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PA2-UX-Android-${{ matrix.api }}-results
          path: results
          retention-days: 60
