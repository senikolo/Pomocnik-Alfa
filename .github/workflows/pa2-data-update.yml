name: PA2 independent timetable refresh
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths: ['.github/workflows/pa2-data-update.yml', 'helpers/pa2/fetch_data.py', 'helpers/pa2/build_data.py']
  schedule:
    - cron: '20 3 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python3 helpers/pa2/fetch_data.py feeds
          python3 helpers/pa2/build_data.py feeds data2
          TZ=Europe/Warsaw node helpers/pa2/test.cjs data2
          (cd data2 && zip -q -r ../pa2-data.zip .)
          gh release view pa2-data >/dev/null 2>&1 || gh release create pa2-data --prerelease --title 'Aktualizacje danych Planera PA 2.0' --notes 'Przetworzone GTFS; źródła, daty i uznanie autorstwa w paczce.'
          gh release upload pa2-data pa2-data.zip --clobber
