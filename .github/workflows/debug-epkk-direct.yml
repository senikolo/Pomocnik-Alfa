name: Debug myTuner EPKK stream

on:
  push:
    paths:
      - 'triggers/debug-epkk-direct.txt'

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect station page and widget scripts
        run: |
          set -euxo pipefail
          UA='Mozilla/5.0 (Linux; Android 11) AppleWebKit/537.36 Chrome/126.0 Mobile Safari/537.36'
          curl -L -A "$UA" --max-time 30 -fsS 'https://mytuner-radio.com/radio/krakow-airport-atc-pl-519787/' -o /tmp/page.html
          curl -L -A "$UA" --max-time 30 -fsS 'https://mytuner-radio.com/static/js/widgets/player-v1.js' -o /tmp/player.js
          curl -L -A "$UA" --max-time 30 -fsS 'https://mytuner-radio.com/static/js/widgets/widget-player-v1.js' -o /tmp/widget.js
          python - <<'PY'
          import re, pathlib
          for path in ['/tmp/page.html','/tmp/player.js','/tmp/widget.js']:
              s=pathlib.Path(path).read_text(errors='ignore')
              print('\n###',path)
              urls=[]
              for u in re.findall(r'https?://[^"\\'<>\\s]+',s):
                  if u not in urls: urls.append(u)
              print('URLS')
              for u in urls[:300]: print(u)
              print('HINT LINES')
              for i,line in enumerate(s.splitlines(),1):
                  if re.search(r'stream|audio|radio_id|station_id|519787|player|ajax|api|target|radio',line,re.I):
                      print(f'{i}: {line[:1200]}')
          PY
          cp /tmp/page.html epkk-page.html
          cp /tmp/player.js epkk-player.js
          cp /tmp/widget.js epkk-widget.js
      - uses: actions/upload-artifact@v4
        with:
          name: epkk-direct-debug
          path: |
            epkk-page.html
            epkk-player.js
            epkk-widget.js
          retention-days: 1
