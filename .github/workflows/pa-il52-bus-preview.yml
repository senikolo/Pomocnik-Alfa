name: PA 1.7.67 IL52 Bus Search Preview
on:
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.issue.title == 'TRIGGER PA IL52 BUS PREVIEW 20261015' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch exact PA 1.7.66 baseline and Apktool
        run: |
          set -euxo pipefail
          mkdir -p source tools output
          gh run download 37921731880 -R "$GITHUB_REPOSITORY" -n Pomocnik-Alfa-1.7.66-A10-AUDIT-FIXES-UNSIGNED -D source
          gh release download v2.12.1 -R iBotPeaches/Apktool -p 'apktool_2.12.1.jar' -D tools
          unzip -t source/Pomocnik-Alfa-1.7.66-A10-AUDIT-FIXES-UNSIGNED.apk >/dev/null
          java -jar tools/apktool_2.12.1.jar --version
      - name: Decode native PA, reuse verbatim IL52 planner source
        run: |
          set -euxo pipefail
          java -Xmx4g -jar tools/apktool_2.12.1.jar d -f -o decoded source/Pomocnik-Alfa-1.7.66-A10-AUDIT-FIXES-UNSIGNED.apk
          python3 -m py_compile helpers/pa-il52/patch_apk.py
          python3 helpers/pa-il52/patch_apk.py decoded
          grep 'ILBusPlannerActivity' decoded/AndroidManifest.xml
          test -s decoded/assets/pa_il52_main_ui.js

      - name: Compile minimal native screen without replacing PA logic
        run: |
          set -euxo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -s "$SDK/platforms/android-35/android.jar"
          mkdir -p classes newdex
          javac -source 8 -target 8 -encoding UTF-8 -cp "$SDK/platforms/android-35/android.jar" -d classes \
            helpers/pa-il52/ILBusClick.java helpers/pa-il52/ILBusPlannerActivity.java
          find classes -name '*.class' -print0 | xargs -0 "$SDK/build-tools/35.0.0/d8" --min-api 29 --lib "$SDK/platforms/android-35/android.jar" --output newdex
          test -s newdex/classes.dex
          cp newdex/classes.dex output/classes5.dex
      - name: Rebuild PA and add only new module dex
        run: |
          set -euxo pipefail
          java -Xmx4g -jar tools/apktool_2.12.1.jar b decoded -o output/pa-rebuilt.apk
          (cd output && zip -q -0 pa-rebuilt.apk classes5.dex)
          unzip -t output/pa-rebuilt.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 output/pa-rebuilt.apk output/pa-aligned.apk

      - name: Sign TEST and verify preserved services
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore output/pa-il52-test.p12 -storepass android -keypass android -alias pa-il52-preview -keyalg RSA -keysize 3072 -validity 365 -dname "CN=PA IL52 isolated preview,OU=Testing,O=Pomocnik Alfa"
          "$BT/apksigner" sign --ks output/pa-il52-test.p12 --ks-type PKCS12 --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias pa-il52-preview --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "output/Pomocnik-Alfa-1.7.67-IL52-BUS-PREVIEW.apk" output/pa-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs "output/Pomocnik-Alfa-1.7.67-IL52-BUS-PREVIEW.apk" | tee output/signature.txt
          "$BT/aapt" dump badging "output/Pomocnik-Alfa-1.7.67-IL52-BUS-PREVIEW.apk" | head -9 | tee output/badging.txt
          grep -F "package: name='com.senikolo.pomocniknowy.ilbuspreview'" output/badging.txt
          unzip -l "output/Pomocnik-Alfa-1.7.67-IL52-BUS-PREVIEW.apk" | grep -E 'classes5.dex|pa_il52_main_ui.js|pa_il52_shell.html|warsaw-lite.zip|mld-lite.zip' | tee output/preserved.txt
          sha256sum "output/Pomocnik-Alfa-1.7.67-IL52-BUS-PREVIEW.apk" > output/sha256.txt
          printf "ISOLATED PREVIEW; not a production PA update\nIL52 main_ui.js SHA-256: 067906d9e11ca6874920a156b12feb549e181061f68ed15ceb18a61438540d50\n" > output/README.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PA-1.7.67-IL52-BUS-PREVIEW-RESULT
          path: |
            output/Pomocnik-Alfa-1.7.67-IL52-BUS-PREVIEW.apk
            output/signature.txt
            output/badging.txt
            output/preserved.txt
            output/sha256.txt
            output/README.txt
          retention-days: 30
