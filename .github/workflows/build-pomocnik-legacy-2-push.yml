name: Build Pomocnik Legacy 2.0

on:
  push:
    paths:
      - 'pomocnik-legacy-build/trigger.txt'

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Reconstruct Legacy 2.0 source
        run: |
          set -euxo pipefail
          cat > /tmp/legacy.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/legacy.b64 | tar -xz -C /tmp
          mv /tmp/Pomocnik-Legacy-FULL project
          grep -n "versionCode 20000" project/app/build.gradle
          grep -n "versionName '2.0.0-legacy-full'" project/app/build.gradle
          grep -n "minSdk 14" project/app/build.gradle

      - name: Restore Pomocnik Alfa cat icon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p /tmp/pa-art /tmp/pa-src project/app/src/main/res/drawable
          gh run download 37463270798 -R senikolo/Pomocnik-Alfa -n Pomocnik-Alfa-1.7.26-SOURCE -D /tmp/pa-art
          TAR="$(find /tmp/pa-art -type f -name '*.tar.xz' | head -1)"
          tar -xJf "$TAR" -C /tmp/pa-src
          ICON="$(find /tmp/pa-src -type f -name 'ic_launcher_cat_legacy.png' | head -1)"
          test -n "$ICON"
          cp "$ICON" project/app/src/main/res/drawable/ic_launcher.png

      - name: Prepare Android SDK
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: project
        run: |
          set -euxo pipefail
          gradle --no-daemon :app:assembleDebug -x lint --stacktrace
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" ../Pomocnik-Legacy-2.0-Android-4.apk

      - name: Verify APK
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt" dump badging Pomocnik-Legacy-2.0-Android-4.apk | tee badging.txt
          grep "sdkVersion:'14'" badging.txt
          grep "package: name='com.senikolo.pomocnik.legacy'" badging.txt
          "$BT/apksigner" verify --verbose --print-certs Pomocnik-Legacy-2.0-Android-4.apk
          sha256sum Pomocnik-Legacy-2.0-Android-4.apk | tee sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Pomocnik-Legacy-2.0-Android-4
          path: Pomocnik-Legacy-2.0-Android-4.apk
          retention-days: 7

      - name: Report run id
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 65 -R senikolo/Pomocnik-Alfa --body "POMOCNIK_LEGACY_20_PUSH_RUN_ID=${{ github.run_id }} STATUS=${{ job.status }}"
