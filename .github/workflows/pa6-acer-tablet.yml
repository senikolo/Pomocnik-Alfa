name: PA UltraSmart Tablet Radio TV Android 6
on:
  workflow_dispatch:
  push:
    branches: ['work/pa6-full-media-20261017']
    paths: ['.github/workflows/pa6-acer-tablet.yml', 'helpers/pa6/**']
defaults:
  run:
    shell: bash
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build full PA dashboard transport radio and TV for Android API23
        run: bash helpers/pa6/build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PA6-Acer-B3A32-APK
          path: |
            output/Pomocnik-Alfa-Tablet-Android6-B3-A32-TEST.apk
            output/badging.txt
            output/signature.txt
            output/SHA256SUMS.txt
            output/data-build.txt
            output/route-tests.txt
            output/transport-tests.txt
          retention-days: 45
  android6:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PA6-Acer-B3A32-APK
          path: pa6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify full PA tablet modules and visual boot on Android 6 API23
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86
          target: default
          profile: Nexus 10
          disable-animations: true
          emulator-boot-timeout: 700
          script: bash helpers/pa6/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PA6-Acer-Android23-Test-Screenshots
          path: results
          retention-days: 45
  release:
    needs: [build, android6]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PA6-Acer-B3A32-APK
          path: release
      - name: Publish PA6 full multimedia prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="pa6-ultrasmart-media-$(echo "$GITHUB_SHA" | cut -c1-8)"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title 'Pomocnik Alfa 2.0 UltraSmart Tablet – Radio i TV Android 6 TEST' \
            --notes 'TEST Acer Iconia 10 / Android 6 API23: wspólny pulpit Pomocnik Alfa UltraSmart z Planerem, Alfą, przystankami, ulubionymi, OSM, radiem internetowym w tle, odtwarzaczem HLS/MP4 TV, odnośnikami do oficjalnej TVP, pogodą Open-Meteo, notatnikiem i lokalnymi przypomnieniami. Odtwarzanie poszczególnych strumieni zależy od kodeków, DRM, sieci i dostępności nadawcy; nie gwarantujemy TVP w natywnym playerze. Rozkłady planowe i tylko sprawdzone dane LIVE. Testowy jednorazowy podpis, osobna instalacja, nie zastępuje PA alpha.9 na telefonie.' \
            release/Pomocnik-Alfa-Tablet-Android6-B3-A32-TEST.apk release/SHA256SUMS.txt release/signature.txt
