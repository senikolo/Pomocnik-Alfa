name: PA6 NewPipe compatibility • Android 6
on:
  workflow_dispatch:
  push:
    branches: ['work/pa6-newpipe-extractor-20261018', 'work/pa6-installed-player-bridge-20261018', 'work/pa6-native-okhttp-20261018', 'work/pa6-adaptive-av-20261018']
    paths: ['.github/workflows/pa6-acer-tablet.yml', 'helpers/pa6/**']
defaults:
  run:
    shell: bash
permissions:
  contents: write
  actions: read
concurrency:
  group: pa6-videofix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build real PA regional planner for Android API23
        run: bash helpers/pa6/build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PA6-Acer-B3A32-APK
          path: |
            output/Pomocnik-Alfa-Tablet-Android6-B3-A32-TEST.apk
            output/badging.txt
            output/signature.txt
            output/SHA256SUMS.txt
            output/data-build.txt
            output/route-tests.txt
            output/transport-tests.txt
          retention-days: 45
  android6:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PA6-Acer-B3A32-APK
          path: pa6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify installation and visual boot on Android 6 API23
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86
          target: default
          profile: Nexus 10
          disable-animations: true
          emulator-boot-timeout: 700
          script: bash helpers/pa6/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PA6-Acer-Android23-Test-Screenshots
          path: results
          retention-days: 45
  release:
    needs: [build, android6]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PA6-Acer-B3A32-APK
          path: release
      - name: Publish Acer Android 6 test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="pa6-adaptive-$(echo "$GITHUB_SHA" | cut -c1-8)"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title 'PA6 Alfa Tube – adaptive audio/video Android 6 TEST' \
            --notes 'PA6 Android 6 TEST: Nowa proba odtwarzania filmu w Alfa Tube i Tube Kids. Wbudowany NewPipe/OkHttp wybiera tez osobne strumienie MP4 wideo i M4A audio, które LibVLC próbuje odtworzyc jednoczesnie. Moduly radio, TV, transport bez zmian. Kompilacja i test Android 6 potwierdzaja uruchomienie, nie gwarantuja rzeczywistego odtwarzania YouTube na tablecie; serwer testowy moze byc blokowany przez YouTube.' \
            release/Pomocnik-Alfa-Tablet-Android6-B3-A32-TEST.apk release/SHA256SUMS.txt release/signature.txt
