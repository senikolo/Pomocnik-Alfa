name: PA6 NewPipe compatibility • Android 6
on:
  workflow_dispatch:
  push:
    branches: ['work/pa6-newpipe-extractor-20261018', 'work/pa6-installed-player-bridge-20261018', 'work/pa6-native-okhttp-20261018', 'work/pa6-adaptive-av-20261018', 'work/pa6-playback-watchdog-codecs-20261018', 'work/pa6-tube-download-quality-layout-20261018']
    paths: ['.github/workflows/pa6-acer-tablet.yml', 'helpers/pa6/**']
defaults:
  run:
    shell: bash
permissions:
  contents: write
  actions: read
concurrency:
  group: pa6-videofix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      PA_STABLE_KEYSTORE_B64: ${{ secrets.PA_STABLE_KEYSTORE_B64 }}
      PA_STABLE_KEYSTORE_PASS: ${{ secrets.PA_STABLE_KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build real PA regional planner for Android API23
        run: bash helpers/pa6/build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PA6-Acer-B3A32-APK
          path: |
            output/Pomocnik-Alfa-Tablet-Android6-B3-A32-TEST.apk
            output/badging.txt
            output/signature.txt
            output/SHA256SUMS.txt
            output/data-build.txt
            output/route-tests.txt
            output/transport-tests.txt
          retention-days: 45
  android6:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PA6-Acer-B3A32-APK
          path: pa6
      - name: MP4 test fixtures
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify installation and visual boot on Android 6 API23
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86
          target: default
          profile: Nexus 10
          disable-animations: true
          emulator-boot-timeout: 700
          script: bash helpers/pa6/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PA6-Acer-Android23-Test-Screenshots
          path: results
          retention-days: 45
  release:
    needs: [build, android6]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PA6-Acer-B3A32-APK
          path: release
      - name: Publish Acer Android 6 test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="pa6-tubeplus-$(echo "$GITHUB_SHA" | cut -c1-8)"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title 'PA6 Tube Plus 2.2.1 – Android 6 TEST' \
            --notes 'TEST 2.2.1 (2002001). Pobieranie MP4 przez HTTPS aplikacji, postęp i zakończenie, kontrola ścieżek obrazu i dźwięku przed zapisaniem, usuwanie niekompletnych plików. Tylko dostępne jakości odtwarzania, przewijanie i przyciski Tablet/Smartfon. NewPipe Extractor + LibVLC zachowane. Stały podpis PA (SHA256 361442c898552236a7d4299eeda5c3dc275ba1f368c011292dc07d44b2e8ace1). Poprzednia wersja pa6-tubeplus-2c938941 używała losowego klucza: aktualizacja tej instalacji nie będzie zgodna. Nie odinstalowuj starej wersji bez kopii danych. APK nie usuwa danych. Filmy wymagające łączenia osobnych ścieżek można oglądać, ale ich pobieranie MP4 nie jest obsługiwane. Test API23 opisuje wyniki emulatora, nie fizycznego Acera.' \
            release/Pomocnik-Alfa-Tablet-Android6-B3-A32-TEST.apk release/SHA256SUMS.txt release/signature.txt
