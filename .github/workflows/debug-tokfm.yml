name: Debug TOK FM schedule HTML

on:
  push:
    paths:
      - 'triggers/debug-tokfm.txt'

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch and inspect TOK FM schedule
        run: |
          set -euxo pipefail
          UA='Mozilla/5.0 (Android; Pomocnik Alfa RadioInfo+)'
          curl -L -A "$UA" -H 'Accept: text/html,application/xhtml+xml' -H 'Accept-Language: pl,en;q=0.8,de;q=0.7' --max-time 20 -sS 'https://audycje.tokfm.pl/ramowka?v=2' -o /tmp/tok.html
          echo "BYTES=$(wc -c </tmp/tok.html)"
          echo '--- TIME TOKENS ---'
          grep -Eo '([01]?[0-9]|2[0-3]):[0-5][0-9]' /tmp/tok.html | sort | uniq -c | head -40 || true
          echo '--- RAW AROUND 16: ---'
          python - <<'PY'
          import re
          s=open('/tmp/tok.html',encoding='utf-8',errors='ignore').read()
          for m in list(re.finditer(r'(?:[01]?\d|2[0-3]):[0-5]\d',s))[:30]:
              a=max(0,m.start()-350); b=min(len(s),m.end()+650)
              print('\n###',m.group(),'###\n',s[a:b].replace('\n',' ')[:1100])
          print('\n--- URL/API TOKENS ---')
          for pat in [r'https?://[^"\'<> ]+', r'/api[^"\'<> ]+', r'graphql[^"\'<> ]*', r'schedule[^"\'<> ]*', r'ramow[^"\'<> ]*']:
              vals=[]
              for x in re.findall(pat,s,re.I):
                  if x not in vals: vals.append(x)
              print(pat)
              for x in vals[:80]: print(x[:500])
          PY
          echo '--- ATTRS AROUND RAMOWKA ---'
          grep -Eio '.{0,120}(ramowka|ramówka|schedule|program).{0,240}' /tmp/tok.html | head -80 || true
          python - <<'PY'
          import re, html
          s=open('/tmp/tok.html',encoding='utf-8',errors='ignore').read()
          m=re.search(r"/_server-islands/ScheduleListIsland\\?[^\\\"']+",s)
          assert m, 'Brak ScheduleListIsland'
          u='https://audycje.tokfm.pl'+html.unescape(m.group(0))
          open('/tmp/island-url','w').write(u)
          print('ISLAND_URL='+u)
          PY
          curl -L -A "$UA" --max-time 20 -sS "$(cat /tmp/island-url)" -o /tmp/island.html
          echo "ISLAND_BYTES=$(wc -c </tmp/island.html)"
          echo '--- ISLAND TIME TOKENS ---'
          grep -Eo '([01]?[0-9]|2[0-3]):[0-5][0-9]' /tmp/island.html | sort | uniq -c | head -60 || true
          echo '--- ISLAND TEXT PREVIEW ---'
          python - <<'PY'
          import re,html
          s=open('/tmp/island.html',encoding='utf-8',errors='ignore').read()
          print(s[:8000])
          PY
          cp /tmp/tok.html tokfm-ramowka.html
          cp /tmp/island.html tokfm-schedule-island.html
      - uses: actions/upload-artifact@v4
        with:
          name: tokfm-ramowka-debug
          path: |
            tokfm-ramowka.html
            tokfm-schedule-island.html
          retention-days: 1
