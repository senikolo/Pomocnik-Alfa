name: Build Pomocnik Alfa 1.7.30 TOK FM Fix

on:
  push:
    paths:
      - 'triggers/build-radio-1730.txt'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify TOK FM live schedule source
        run: |
          set -euxo pipefail
          UA='Mozilla/5.0 (Android; Pomocnik Alfa RadioInfo+)'
          curl -L -A "$UA" -H 'Accept: text/html,application/xhtml+xml' -H 'Accept-Language: pl,en;q=0.8,de;q=0.7' --retry 3 --retry-all-errors --connect-timeout 12 --max-time 60 -sS 'https://audycje.tokfm.pl/ramowka?v=2' -o /tmp/tok.html
          python - <<'PY'
          import re,html,datetime,zoneinfo,subprocess
          s=open('/tmp/tok.html',encoding='utf-8',errors='ignore').read()
          m=re.search(r"/_server-islands/ScheduleListIsland\?[^\"']+",s)
          assert m, 'Brak TOK FM ScheduleListIsland'
          u='https://audycje.tokfm.pl'+html.unescape(m.group(0))
          print('TOK_ISLAND='+u)
          subprocess.run(['curl','-L','-A','Mozilla/5.0 (Android; Pomocnik Alfa RadioInfo+)','--retry','3','--retry-all-errors','--connect-timeout','12','--max-time','60','-sS',u,'-o','/tmp/island.html'],check=True)
          island=open('/tmp/island.html',encoding='utf-8',errors='ignore').read()
          now=datetime.datetime.now(zoneinfo.ZoneInfo('Europe/Warsaw'))
          day=now.weekday()
          dm=re.search(rf'(?is)<ul[^>]*data-day=["\']?{day}["\']?[^>]*>(.*?)</ul>',island)
          assert dm, f'Brak dzisiejszego data-day={day}'
          block=dm.group(1)
          nowm=now.hour*60+now.minute
          best=(-1,'')
          for im in re.finditer(r'(?is)<li[^>]*data-time=["\']([0-2]?\d:[0-5]\d)["\'][^>]*>(.*?)</li>',block):
              hh,mm=map(int,im.group(1).split(':')); mins=hh*60+mm
              if mins>nowm or mins<best[0]: continue
              body=im.group(2)
              am=re.search(r'(?is)<h3[^>]*tok-schedule__program--name[^>]*>\s*<a[^>]*href=["\']/audycja/[^"\']*["\'][^>]*>(.*?)</a>',body)
              if not am:
                  am=re.search(r'(?is)<h3[^>]*tok-schedule__program--name[^>]*>(.*?)</h3>',body)
              if am:
                  name=html.unescape(re.sub(r'(?s)<[^>]+>',' ',am.group(1)))
                  name=' '.join(name.split())
                  if name: best=(mins,name)
          assert best[1], 'Nie udało się ustalić bieżącej audycji TOK FM'
          print('TOK_CURRENT='+best[1])
          PY

      - name: Restore verified 1.7.29 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir artifact project
          gh run download 37485148842 -R senikolo/Pomocnik-Alfa -n Pomocnik-Alfa-1.7.29-SOURCE -D artifact
          tar -xJf artifact/Pomocnik-Alfa-1.7.29-SOURCE.tar.xz -C project
          grep -n "versionCode 10729" project/app/build.gradle

      - name: Apply TOK FM server island fix
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          b=Path('project/app/build.gradle')
          t=b.read_text()
          t=t.replace('versionCode 10729','versionCode 10730').replace("versionName '1.7.29'","versionName '1.7.30'")
          b.write_text(t)

          p=Path('project/app/src/main/java/com/ispina/lokalnie/radio/RadioInfoPlus.java')
          s=p.read_text()
          import re
          pattern=r'''        if\(eq\(station,"TOK FM"\)\)\{\s*Result r=parseTokFm\(toLines\(download\("https://audycje\.tokfm\.pl/ramowka\?v=2"\)\)\);\s*if\(r\.hasAnything\(\)\)r\.source="TOK FM • ramówka";\s*return r;\s*\}'''
          new='''        if(eq(station,"TOK FM")){
              Result r=fetchTokFmSchedule();
              if(r.hasAnything())r.source="TOK FM • ramówka live";
              return r;
          }'''
          s,n=re.subn(pattern,new,s,count=1)
          assert n==1, 'Nie znaleziono starego bloku TOK FM'

          anchor='''    private static String download(String url) throws Exception{
          '''
          insert=r'''    private static Result fetchTokFmSchedule() throws Exception{
              Result out=new Result();
              String shell=downloadTokFm("https://audycje.tokfm.pl/ramowka?v=2");
              if(shell.isEmpty())return out;
              Matcher m=Pattern.compile("/_server-islands/ScheduleListIsland\\?[^\\\"']+").matcher(shell);
              if(!m.find())return out;
              String path=m.group().replace("&amp;","&");
              String island=downloadTokFm("https://audycje.tokfm.pl"+path);
              if(island.isEmpty())return out;
              return parseTokFmIsland(island);
          }

          private static Result parseTokFmIsland(String html){
              Result r=new Result();
              Calendar cal=Calendar.getInstance(TimeZone.getTimeZone("Europe/Warsaw"));
              int day=(cal.get(Calendar.DAY_OF_WEEK)+5)%7;
              int now=cal.get(Calendar.HOUR_OF_DAY)*60+cal.get(Calendar.MINUTE);
              Pattern dayPattern=Pattern.compile("(?is)<ul[^>]*data-day=[\\\"']?"+day+"[\\\"']?[^>]*>(.*?)</ul>");
              Matcher dm=dayPattern.matcher(html);
              if(!dm.find())return r;
              String block=dm.group(1);
              Pattern itemPattern=Pattern.compile("(?is)<li[^>]*data-time=[\\\"']([0-2]?\\d:[0-5]\\d)[\\\"'][^>]*>(.*?)</li>");
              Matcher im=itemPattern.matcher(block);
              int best=-1;
              String bestProgram="";
              while(im.find()){
                  int mins=minutesFromLine(im.group(1));
                  if(mins<0||mins>now||mins<best)continue;
                  String program=extractTokProgram(im.group(2));
                  if(program.isEmpty())continue;
                  best=mins;
                  bestProgram=program;
              }
              if(!bestProgram.isEmpty())r.program=bestProgram;
              return r;
          }

          private static String extractTokProgram(String item){
              Matcher a=Pattern.compile("(?is)<h3[^>]*tok-schedule__program--name[^>]*>\\s*<a[^>]*href=[\\\"']/audycja/[^\\\"']*[\\\"'][^>]*>(.*?)</a>").matcher(item);
              if(a.find())return htmlText(a.group(1));
              Matcher h=Pattern.compile("(?is)<h3[^>]*tok-schedule__program--name[^>]*>(.*?)</h3>").matcher(item);
              if(h.find())return htmlText(h.group(1));
              return "";
          }

          private static String htmlText(String value){
              if(value==null)return "";
              String x=value.replaceAll("(?s)<[^>]+>"," ");
              try{x=Html.fromHtml(x,Html.FROM_HTML_MODE_LEGACY).toString();}catch(Throwable ignored){}
              return clean(x);
          }

          private static String downloadTokFm(String url) throws Exception{
              Exception last=null;
              for(int attempt=0;attempt<3;attempt++){
                  HttpURLConnection c=null;
                  try{
                      c=(HttpURLConnection)new URL(url).openConnection();
                      c.setInstanceFollowRedirects(true);
                      c.setConnectTimeout(12000);
                      c.setReadTimeout(20000);
                      c.setRequestProperty("User-Agent","Mozilla/5.0 (Linux; Android 11) AppleWebKit/537.36 Chrome/126.0 Mobile Safari/537.36");
                      c.setRequestProperty("Accept","text/html,application/xhtml+xml,*/*;q=0.8");
                      c.setRequestProperty("Accept-Language","pl-PL,pl;q=0.9,en;q=0.6");
                      c.setRequestProperty("Cache-Control","no-cache");
                      c.setRequestProperty("Pragma","no-cache");
                      c.setRequestProperty("Referer","https://audycje.tokfm.pl/ramowka?v=2");
                      int code=c.getResponseCode();
                      if(code<200||code>=400)throw new java.io.IOException("TOK FM HTTP "+code);
                      BufferedReader br=new BufferedReader(new InputStreamReader(c.getInputStream(),StandardCharsets.UTF_8));
                      StringBuilder sb=new StringBuilder();
                      char[] buf=new char[8192];
                      int n,total=0;
                      while((n=br.read(buf))>0&&total<1600000){sb.append(buf,0,n);total+=n;}
                      if(sb.length()>0)return sb.toString();
                  }catch(Exception e){last=e;}
                  finally{if(c!=null)c.disconnect();}
                  try{Thread.sleep(350L*(attempt+1));}catch(InterruptedException ie){Thread.currentThread().interrupt();break;}
              }
              if(last!=null)throw last;
              return "";
          }

          '''
          assert anchor in s, 'Nie znaleziono miejsca na helpery TOK FM'
          s=s.replace(anchor,insert+anchor)
          p.write_text(s)
          PY
          grep -n "versionCode 10730" project/app/build.gradle
          grep -n "fetchTokFmSchedule" project/app/src/main/java/com/ispina/lokalnie/radio/RadioInfoPlus.java
          grep -n "ScheduleListIsland" project/app/src/main/java/com/ispina/lokalnie/radio/RadioInfoPlus.java
          cd project
          tar -cJf ../Pomocnik-Alfa-1.7.30-SOURCE.tar.xz .

      - name: Make side-by-side test package
        run: |
          set -euxo pipefail
          sed -i "s/applicationId 'com.senikolo.pomocniknowy'/applicationId 'com.senikolo.pomocniknowy.radio1730'/" project/app/build.gradle
          sed -i 's/android:label="Pomocnik Alfa"/android:label="Pomocnik Alfa TOK FM 1.7.30"/' project/app/src/main/AndroidManifest.xml

      - name: Prepare Android SDK
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: project
        run: |
          set -euxo pipefail
          chmod +x gradlew
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          android.useAndroidX=true
          EOF
          ./gradlew --no-daemon assembleDebug -x lint --stacktrace
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" ../Pomocnik-Alfa-1.7.30-TOK-FM-FIX.apk

      - name: Verify APK
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s Pomocnik-Alfa-1.7.30-TOK-FM-FIX.apk
          "$BT/aapt" dump badging Pomocnik-Alfa-1.7.30-TOK-FM-FIX.apk | head -3
          "$BT/apksigner" verify --verbose --print-certs Pomocnik-Alfa-1.7.30-TOK-FM-FIX.apk
          sha256sum Pomocnik-Alfa-1.7.30-TOK-FM-FIX.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pomocnik-Alfa-1.7.30-TOK-FM-FIX
          path: Pomocnik-Alfa-1.7.30-TOK-FM-FIX.apk
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: Pomocnik-Alfa-1.7.30-SOURCE
          path: Pomocnik-Alfa-1.7.30-SOURCE.tar.xz
          retention-days: 3
