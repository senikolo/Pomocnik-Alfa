name: Package Pomocnik Alfa 1.7.22 Radio Test

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  package:
    if: ${{ github.event_name != 'issues' || github.event.issue.title == 'TRIGGER PA 1.7.22 RADIO PACKAGE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore verified 1.7.22 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir artifact project
          gh run download 37448472005 -R senikolo/Pomocnik-Alfa -n Pomocnik-Alfa-1.7.22-SOURCE -D artifact
          tar -xJf artifact/Pomocnik-Alfa-1.7.22-SOURCE.tar.xz -C project
          grep -n "versionCode 10722" project/app/build.gradle
          grep -n "RADIO_NOTIFICATION_ID=1722" project/app/src/main/java/com/ispina/lokalnie/radio/RadioService.java

      - name: Make side-by-side Radio Test package
        run: |
          set -euxo pipefail
          sed -i "s/applicationId 'com.senikolo.pomocniknowy'/applicationId 'com.senikolo.pomocniknowy.radiotest'/" project/app/build.gradle
          sed -i 's/android:label="Pomocnik Alfa"/android:label="Pomocnik Alfa RADIO TEST"/' project/app/src/main/AndroidManifest.xml
          grep -n "com.senikolo.pomocniknowy.radiotest" project/app/build.gradle
          grep -n 'Pomocnik Alfa RADIO TEST' project/app/src/main/AndroidManifest.xml

      - name: Prepare Android SDK
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Build signed debug APK
        working-directory: project
        run: |
          set -euxo pipefail
          chmod +x gradlew
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          android.useAndroidX=true
          EOF
          ./gradlew --no-daemon assembleDebug -x lint --stacktrace
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" ../Pomocnik-Alfa-1.7.22-RADIO-TEST.apk

      - name: Verify packaged APK
        run: |
          set -euxo pipefail
          test -s Pomocnik-Alfa-1.7.22-RADIO-TEST.apk
          /usr/local/lib/android/sdk/build-tools/35.0.0/aapt dump badging Pomocnik-Alfa-1.7.22-RADIO-TEST.apk | head -3
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose --print-certs Pomocnik-Alfa-1.7.22-RADIO-TEST.apk
          sha256sum Pomocnik-Alfa-1.7.22-RADIO-TEST.apk

      - name: Upload packaged APK
        uses: actions/upload-artifact@v4
        with:
          name: Pomocnik-Alfa-1.7.22-RADIO-TEST
          path: Pomocnik-Alfa-1.7.22-RADIO-TEST.apk
          retention-days: 7
