name: PA6 2.4.8 • early installable APK with HLS checks
on:
  push:
    branches: ['work/pa6-248-german-tv-repair-20261019']
    paths: ['.github/workflows/pa6-248-package.yml', 'helpers/pa6/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  android6-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and exercise actual production HTTP/HLS relay
        run: |
          set -euo pipefail
          mkdir -p results/relay
          javac -source 8 -target 8 -encoding UTF-8 -d results/relay \
            helpers/pa6/native/PA6StreamRelay.java helpers/pa6/StreamRelayTest.java
          timeout 90s java -cp results/relay com.ispina.lokalnie.StreamRelayTest \
            | tee results/stream-relay-tests.txt
          grep -q '^PASS ' results/stream-relay-tests.txt
      - name: Prepare separate QA APK package
        run: |
          set -euo pipefail
          # This APK is for a fresh CI emulator only: NEVER replace the user's signed 2.4.8.
          sed -i 's/package="com.senikolo.pa6.stable"/package="com.senikolo.pa6.tv248"/' helpers/pa6/AndroidManifest.xml
          echo "PA6_APP_ID=com.senikolo.pa6.tv248" >> "$GITHUB_ENV"
      - name: Build complete Android 6 application
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash helpers/pa6/build.sh
      - name: Test-sign fresh CI-only APK and verify
        run: |
          set -euo pipefail
          mkdir -p pa6 results
          export QA_KEY_PASS=temporary-ci-test-certificate
          keytool -genkeypair -noprompt -alias "qa248" -keyalg RSA -keysize 3072 \
            -validity 30 -storetype PKCS12 -keystore /tmp/qa248.p12 \
            -storepass "$QA_KEY_PASS" -keypass "$QA_KEY_PASS" \
            -dname "CN=PA6 2.4.8 separate install test,OU=Automated Tests,O=PA,C=PL"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" sign --ks /tmp/qa248.p12 --ks-type PKCS12 \
            --ks-key-alias qa248 --ks-pass env:QA_KEY_PASS --key-pass env:QA_KEY_PASS \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out pa6/Pomocnik-Alfa-6-2.4.8-German-TV-TEST.apk output/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs pa6/Pomocnik-Alfa-6-2.4.8-German-TV-TEST.apk > pa6/signature.txt
          "$BT/aapt" dump badging pa6/Pomocnik-Alfa-6-2.4.8-German-TV-TEST.apk | tee pa6/badging.txt
          grep -q "package: name='com.senikolo.pa6.tv248' versionCode='2004008'" pa6/badging.txt
          grep -q "sdkVersion:'23'" pa6/badging.txt
          (cd pa6 && sha256sum *.apk > SHA256SUMS.txt)
          echo 'Test APK has separate package and signing certificate. Install alongside current PA6.' > pa6/QA-NOT-RELEASE.txt
          # The old smoke test still refers to the prior version's APK filename.
          sed -i 's/Pomocnik-Alfa-6-2.4.2-Premium-Preview.apk/Pomocnik-Alfa-6-2.4.8-German-TV-TEST.apk/g' helpers/pa6/smoke.sh
      - name: Upload signed installable Android 6 APK without waiting for emulator
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PA6-2.4.8-German-TV-Signed-Test-APK
          path: |
            pa6/Pomocnik-Alfa-6-2.4.8-German-TV-TEST.apk
            pa6/SHA256SUMS.txt
            pa6/signature.txt
            pa6/badging.txt
            output/stream-relay-tests.txt
            output/tv-source-audit.md
          if-no-files-found: error
          retention-days: 45

      - name: API 23 install and embedded player start
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86
          target: default
          profile: Nexus 10
          disable-animations: true
          emulator-boot-timeout: 700
          script: |
            adb install pa6/Pomocnik-Alfa-6-2.4.8-German-TV-TEST.apk
            adb shell am start -W -n com.senikolo.pa6.tv248/com.ispina.lokalnie.PA6TvActivity --ez verify_libvlc true
            sleep 10
            adb logcat -d | tee results/api23-tv-start.log
            grep -q 'PA6_LIBVLC.*NATIVE_ENGINE_READY' results/api23-tv-start.log
            ! grep -q 'FATAL EXCEPTION.*com.senikolo.pa6.tv248' results/api23-tv-start.log
