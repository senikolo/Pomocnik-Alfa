name: Sign Pomocnik Alfa 1.7.9

on:
  push:
    paths:
      - '.github/workflows/sign-179-test.yml'

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command line tools
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"
          curl -fL --retry 4 "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o cmdline.zip
          unzip -q cmdline.zip -d android-cli
          cp -R android-cli/cmdline-tools/. "$HOME/android-sdk/cmdline-tools/latest/"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"

      - name: Download unsigned APK
        run: |
          curl -fL --retry 4 "https://github.com/senikolo/Pomocnik-Alfa/releases/download/build-1.7.9-unsigned/Pomocnik-Alfa-1.7.9-UNSIGNED.apk" -o app-unsigned.apk
          test -s app-unsigned.apk

      - name: Generate signing key
        run: |
          keytool -genkeypair -keystore pa179.jks -storepass Pomocnik179Test2026 -keypass Pomocnik179Test2026 -alias pa179 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Pomocnik Alfa 1.7.9,O=Pomocnik Alfa,C=PL"

      - name: Zipalign and sign APK
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -p -f 4 app-unsigned.apk app-aligned.apk
          "$BT/apksigner" sign --ks pa179.jks --ks-key-alias pa179 --ks-pass pass:Pomocnik179Test2026 --key-pass pass:Pomocnik179Test2026 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out Pomocnik-Alfa-1.7.9-ANDROID11-FIX.apk app-aligned.apk

      - name: Verify APK
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -c -v 4 Pomocnik-Alfa-1.7.9-ANDROID11-FIX.apk
          "$BT/apksigner" verify --verbose --print-certs Pomocnik-Alfa-1.7.9-ANDROID11-FIX.apk
          sha256sum Pomocnik-Alfa-1.7.9-ANDROID11-FIX.apk
          ls -lh Pomocnik-Alfa-1.7.9-ANDROID11-FIX.apk

      - name: Publish fixed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-1.7.9-android11-fix -y || true
          git push --delete origin build-1.7.9-android11-fix || true
          gh release create build-1.7.9-android11-fix "Pomocnik-Alfa-1.7.9-ANDROID11-FIX.apk#Pomocnik-Alfa-1.7.9-ANDROID11-FIX.apk" --title "Pomocnik Alfa 1.7.9 Android 11 Fix" --notes "APK podpisany przez zipalign + apksigner v1/v2/v3. Wersja testowa z poprawką Alfa Tube."
