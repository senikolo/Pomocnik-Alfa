name: Build Alfa Launcher 7 weather fix

on:
  push:
    branches:
      - launcher7-weather-fix-162
    paths:
      - "launcher7/**"
      - ".github/workflows/launcher7-weather-fix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Get apktool
        run: |
          mkdir -p launcher7/tools
          curl -fsSL -o launcher7/tools/apktool.jar             https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar

      - name: Decode original APK
        run: |
          java -jar launcher7/tools/apktool.jar d -f             launcher7/Alfa-Launcher-7-1.6.1-STABLE-Android-7.apk             -o launcher7/decoded

      - name: Patch Android 7 TLS trust and package id
        run: |
          python3 launcher7/patch_weather.py launcher7/decoded
          mkdir -p launcher7/decoded/res/raw
          : > launcher7/decoded/res/raw/compat_roots.pem

          # Root widely needed by older Android trust stores.
          curl -fsSL https://letsencrypt.org/certs/isrgrootx1.pem             >> launcher7/decoded/res/raw/compat_roots.pem

          # Optional additional modern root.
          curl -fsSL https://letsencrypt.org/certs/isrg-root-x2.pem             >> launcher7/decoded/res/raw/compat_roots.pem || true

          # Pin the currently served intermediates as extra trust anchors.
          # This gives Android 7 a working path even when its system CA store is stale.
          for host in api.open-meteo.com geocoding-api.open-meteo.com nominatim.openstreetmap.org; do
            echo | openssl s_client -showcerts -servername "$host" -connect "$host:443" 2>/dev/null               | sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p'               >> launcher7/decoded/res/raw/compat_roots.pem || true
          done

          test -s launcher7/decoded/res/raw/compat_roots.pem

      - name: Rebuild APK
        run: |
          java -jar launcher7/tools/apktool.jar b launcher7/decoded             -o launcher7/Alfa-Launcher-7-1.6.2-WEATHER-FIX-Android-7-unsigned.apk

      - name: Align and sign
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK not found" >&2
            exit 1
          fi
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          keytool -genkeypair -v             -keystore launcher7/weather-fix.keystore             -storepass alfa162 -keypass alfa162             -alias alfaweather             -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=Alfa Launcher 7 Weather Fix, O=Personal Build, C=PL"

          "$ZIPALIGN" -f -p 4             launcher7/Alfa-Launcher-7-1.6.2-WEATHER-FIX-Android-7-unsigned.apk             launcher7/Alfa-Launcher-7-1.6.2-WEATHER-FIX-Android-7-aligned.apk

          "$APKSIGNER" sign             --ks launcher7/weather-fix.keystore             --ks-pass pass:alfa162             --key-pass pass:alfa162             --out launcher7/Alfa-Launcher-7-1.6.2-WEATHER-FIX-Android-7.apk             launcher7/Alfa-Launcher-7-1.6.2-WEATHER-FIX-Android-7-aligned.apk

          "$APKSIGNER" verify --verbose --print-certs             launcher7/Alfa-Launcher-7-1.6.2-WEATHER-FIX-Android-7.apk
          sha256sum launcher7/Alfa-Launcher-7-1.6.2-WEATHER-FIX-Android-7.apk             | tee launcher7/SHA256.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Alfa-Launcher-7-1.6.2-WEATHER-FIX-Android-7
          path: |
            launcher7/Alfa-Launcher-7-1.6.2-WEATHER-FIX-Android-7.apk
            launcher7/SHA256.txt
          if-no-files-found: error
          retention-days: 30
