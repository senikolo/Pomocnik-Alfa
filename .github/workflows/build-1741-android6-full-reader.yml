name: Build Pomocnik Alfa 1.7.41 Android 6 Full Reader

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: ${{ github.event.issue.title == 'TRIGGER PA 1.7.41 ANDROID 6' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Android 6 reader source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir artifact
          gh run download 37574069132 -R senikolo/Pomocnik-Alfa -n Pomocnik-Alfa-1.7.36-CZYTNIK-ALFA-SOURCE -D artifact
          tar -xJf artifact/Pomocnik-Alfa-1.7.36-CZYTNIK-ALFA-SOURCE.tar.xz
          test -d project
          grep -n "minSdk 23" project/app/build.gradle

      - name: Apply full reader from Android 10 line
        run: |
          set -euxo pipefail
          python helpers/czytnik-alfa/patch_modern_reader.py
          python helpers/czytnik-alfa/patch_fullscreen_reader.py
          python helpers/czytnik-alfa/patch_pdf_zoom_sepia.py
          python - <<'PY'
          from pathlib import Path
          p=Path('project/app/build.gradle')
          s=p.read_text()
          s=s.replace('minSdk 29','minSdk 23')
          s=s.replace('versionCode 10740','versionCode 10741')
          s=s.replace("versionName '1.7.40'","versionName '1.7.41'")
          p.write_text(s)
          m=Path('project/app/src/main/java/com/ispina/lokalnie/MainActivity.java')
          t=m.read_text().replace('POMOCNIK ALFA 1.7.40','POMOCNIK ALFA 1.7.41')
          m.write_text(t)
          PY
          grep -n "minSdk 23" project/app/build.gradle
          grep -n "versionCode 10741" project/app/build.gradle
          grep -n "PdfZoomImageView" project/app/src/main/java/com/ispina/lokalnie/ReaderActivity.java
          grep -n "applyPdfTheme" project/app/src/main/java/com/ispina/lokalnie/ReaderActivity.java

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android SDK
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Build Android 6+ APK
        working-directory: project
        run: |
          set -euxo pipefail
          chmod +x gradlew
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          ./gradlew --no-daemon assembleDebug -x lint --stacktrace
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" ../Pomocnik-Alfa-1.7.41-ANDROID6-FULL-READER.apk

      - name: Verify APK
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt" dump badging Pomocnik-Alfa-1.7.41-ANDROID6-FULL-READER.apk | tee badging.txt
          grep "package: name='com.senikolo.pomocniknowy'" badging.txt
          grep "versionCode='10741'" badging.txt
          grep "sdkVersion:'23'" badging.txt
          "$BT/apksigner" verify --verbose --print-certs Pomocnik-Alfa-1.7.41-ANDROID6-FULL-READER.apk | tee signature.txt
          sha256sum Pomocnik-Alfa-1.7.41-ANDROID6-FULL-READER.apk | tee sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Pomocnik-Alfa-1.7.41-ANDROID6-FULL-READER
          path: Pomocnik-Alfa-1.7.41-ANDROID6-FULL-READER.apk
          retention-days: 7
