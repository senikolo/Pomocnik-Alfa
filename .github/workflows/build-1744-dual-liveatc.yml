name: Build PA 1.7.44 Dual LiveATC

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  build:
    if: ${{ github.event.issue.title == 'TRIGGER PA 1.7.44 DUAL LIVEATC' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore current source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir artifact
          gh run download 37574069132 -R senikolo/Pomocnik-Alfa -n Pomocnik-Alfa-1.7.36-CZYTNIK-ALFA-SOURCE -D artifact
          tar -xJf artifact/Pomocnik-Alfa-1.7.36-CZYTNIK-ALFA-SOURCE.tar.xz
          test -d project
          test -s project/app/src/main/res/raw/isrg_root_x1.pem

      - name: Apply reader, Russian TV and dual LiveATC selector
        run: |
          set -euxo pipefail
          python helpers/czytnik-alfa/patch_modern_reader.py
          python helpers/czytnik-alfa/patch_fullscreen_reader.py
          python helpers/czytnik-alfa/patch_pdf_zoom_sepia.py

          python - <<'PY'
          from pathlib import Path
          import re

          tv=Path('project/app/src/main/java/com/ispina/lokalnie/TvActivity.java')
          s=tv.read_text()
          repl={
          'v -> startBroadcast("Россия 1", "1", true)':'v -> startDirectFallback("Россия 1", new String[]{"https://live.smotrim.ru/vgtrk/0/russia1-hd/index.m3u8","https://vgtrkregion-reg.cdnvideo.ru/vgtrk/0/russia1-hd/index.m3u8"})',
          'v -> startBroadcast("Россия 24", "3", true)':'v -> startDirectFallback("Россия 24", new String[]{"https://live.smotrim.ru/vgtrk/0/russia24-hd/index.m3u8","https://vgtrkregion-reg.cdnvideo.ru/vgtrk/0/russia24-hd/720p.m3u8","https://vgtrkregion-reg.cdnvideo.ru/vgtrk/0/russia24-hd/1080p.m3u8"})',
          'v -> startBroadcast("Россия Культура", "4", true)':'v -> startDirectFallback("Россия Культура", new String[]{"https://live.smotrim.ru/vgtrk/0/kultura-hd/index.m3u8","https://vgtrkregion-reg.cdnvideo.ru/vgtrk/0/kultura-hd/index.m3u8"})',
          'v -> startBroadcast("НТВ Сериал", "ntvseries", true)':'v -> startDirectFallback("НТВ Сериал", new String[]{"https://cdn.ntv.ru/th_serial/playlist.m3u8"})',
          'v -> startBroadcast("СТС / STS", "ctc_ext", true)':'v -> startDirectFallback("СТС / STS", new String[]{"https://zabava-htlive.cdn.ngenix.net/hls/CH_STS/variant.m3u8","https://zabava-htlive.cdn.ngenix.net/hls/CH_STS_2/variant.m3u8"})',
          'v -> startBroadcast("НТВ / NTV", "ntv", true)':'v -> startDirectFallback("НТВ / NTV", new String[]{"https://cdn-dvr.ntv.ru/ntv0_hd/index.m3u8","https://cdn.ntv.ru/ntv-spb/index.m3u8","https://cdn.ntv.ru/vitrina/index.m3u8"})',
          'v -> startBroadcast("World Fashion Channel Russia", "wfc", true)':'v -> startDirectFallback("World Fashion Channel Russia", new String[]{"https://cdn.wfc.tv/cdn/stream-rus.m3u8"})',
          'v -> startBroadcast("НТВ Стиль / NTV Style", "ntvstyle", true)':'v -> startDirectFallback("НТВ Стиль / NTV Style", new String[]{"https://cdn.ntv.ru/th_style/playlist.m3u8"})'}
          for a,b in repl.items():
              if s.count(a)!=1:
                  raise SystemExit(f'missing selector: {a}')
              s=s.replace(a,b)
          tv.write_text(s)

          aviation = r'''package com.ispina.lokalnie;

          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class AviationActivity extends ThemedActivity {
              private static final String EPKK_PAGE = "https://www.liveatc.net/search/?icao=EPKK";
              private static final String EPWA_PAGE = "https://www.liveatc.net/search/?icao=EPWA";

              @Override protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  buildUi();
              }

              private void buildUi() {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.setBackgroundColor(NativeUi.bg(this));

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(NativeUi.dp(this,14), NativeUi.dp(this,14), NativeUi.dp(this,14), NativeUi.dp(this,28));
                  scroll.addView(root);

                  LinearLayout head = new LinearLayout(this);
                  head.setGravity(Gravity.CENTER_VERTICAL);
                  Button back = NativeUi.button(this,"‹",true);
                  back.setTextSize(24);
                  back.setOnClickListener(v -> finish());
                  head.addView(back,new LinearLayout.LayoutParams(NativeUi.dp(this,48),NativeUi.dp(this,46)));
                  TextView title = NativeUi.text(this,"Nasłuch pilotów",24,true);
                  title.setPadding(NativeUi.dp(this,12),0,0,0);
                  head.addView(title,new LinearLayout.LayoutParams(0,-2,1));
                  root.addView(head);

                  LinearLayout intro = NativeUi.card(this);
                  intro.addView(NativeUi.text(this,"✈️ Wybierz lotnisko",19,true));
                  NativeUi.addSpacer(intro,this,5);
                  intro.addView(NativeUi.muted(this,
                          "Kafelek prowadzi teraz do dwóch oficjalnych transmisji LiveATC. Wybierz Kraków-Balice albo Warszawę-Chopina.",13));
                  root.addView(intro);

                  LinearLayout krk = NativeUi.card(this);
                  krk.addView(NativeUi.text(this,"Kraków · EPKK",19,true));
                  NativeUi.addSpacer(krk,this,4);
                  krk.addView(NativeUi.muted(this,
                          "Tower / Approach · transmisja LiveATC dla Krakowa-Balic.",13));
                  NativeUi.addSpacer(krk,this,10);
                  Button krkButton = NativeUi.button(this,"▶ Otwórz LiveATC Kraków",false);
                  krkButton.setOnClickListener(v -> openLiveAtc(EPKK_PAGE));
                  krk.addView(krkButton,new LinearLayout.LayoutParams(-1,NativeUi.dp(this,52)));
                  root.addView(krk);

                  LinearLayout waw = NativeUi.card(this);
                  waw.addView(NativeUi.text(this,"Warszawa · EPWA",19,true));
                  NativeUi.addSpacer(waw,this,4);
                  waw.addView(NativeUi.muted(this,
                          "Warszawa-Chopina · transmisja LiveATC dla EPWA.",13));
                  NativeUi.addSpacer(waw,this,10);
                  Button wawButton = NativeUi.button(this,"▶ Otwórz LiveATC Warszawa",false);
                  wawButton.setOnClickListener(v -> openLiveAtc(EPWA_PAGE));
                  waw.addView(wawButton,new LinearLayout.LayoutParams(-1,NativeUi.dp(this,52)));
                  root.addView(waw);

                  LinearLayout note = NativeUi.card(this);
                  note.addView(NativeUi.text(this,"Informacja",17,true));
                  NativeUi.addSpacer(note,this,4);
                  note.addView(NativeUi.muted(this,
                          "LiveATC otwiera się w przeglądarce, dzięki czemu korzystamy z oficjalnego odtwarzacza serwisu. Jeśli dany feed ma status DOWN, możesz wrócić i wybrać drugie lotnisko.",12));
                  root.addView(note);

                  setContentView(scroll);
              }

              private void openLiveAtc(String url) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                  } catch (ActivityNotFoundException e) {
                      Toast.makeText(this,"Brak przeglądarki do otwarcia LiveATC.",Toast.LENGTH_LONG).show();
                  } catch (Throwable e) {
                      Toast.makeText(this,"Nie udało się otworzyć LiveATC.",Toast.LENGTH_LONG).show();
                  }
              }
          }
          '''
          Path('project/app/src/main/java/com/ispina/lokalnie/AviationActivity.java').write_text(aviation)

          p=Path('project/app/build.gradle')
          x=p.read_text()
          x=re.sub(r'\bminSdk\s+\d+','minSdk 23',x,count=1)
          x=re.sub(r'\bversionCode\s+\d+','versionCode 10744',x,count=1)
          x=re.sub(r"\bversionName\s+'[^']+'","versionName '1.7.44'",x,count=1)
          p.write_text(x)

          m=Path('project/app/src/main/java/com/ispina/lokalnie/MainActivity.java')
          m.write_text(re.sub(r'POMOCNIK ALFA 1\.7\.\d+','POMOCNIK ALFA 1.7.44',m.read_text()))
          PY

          grep -n "EPKK_PAGE\|EPWA_PAGE\|Otwórz LiveATC" project/app/src/main/java/com/ispina/lokalnie/AviationActivity.java
          grep -n "versionCode 10744" project/app/build.gradle
          grep -n "minSdk 23" project/app/build.gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android SDK
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Build unsigned release
        working-directory: project
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -x lint --stacktrace
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          test -s "$APK"
          cp "$APK" ../Pomocnik-Alfa-1.7.44-DUAL-LIVEATC-UNSIGNED.apk

      - name: Verify package
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt" dump badging Pomocnik-Alfa-1.7.44-DUAL-LIVEATC-UNSIGNED.apk | tee badging.txt
          grep "versionCode='10744'" badging.txt
          grep "sdkVersion:'23'" badging.txt
          unzip -t Pomocnik-Alfa-1.7.44-DUAL-LIVEATC-UNSIGNED.apk >/dev/null
          sha256sum Pomocnik-Alfa-1.7.44-DUAL-LIVEATC-UNSIGNED.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pomocnik-Alfa-1.7.44-DUAL-LIVEATC-UNSIGNED
          path: Pomocnik-Alfa-1.7.44-DUAL-LIVEATC-UNSIGNED.apk
          retention-days: 7

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ST: ${{ job.status }}
        run: gh issue create --title "PA 1.7.44 DUAL LIVEATC RESULT $ST $GITHUB_RUN_ID" --body "Build $ST. Run $GITHUB_RUN_ID"
