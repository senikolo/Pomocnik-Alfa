name: Build Pomocnik Alfa 1.7.29 Full Radio Info

on:
  workflow_dispatch:
  push:
    paths:
      - 'triggers/build-radio-1729.txt'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check critical official radio sources
        run: |
          set -euxo pipefail
          UA='Mozilla/5.0 (Linux; Android 11) AppleWebKit/537.36 Chrome/126.0 Mobile Safari/537.36'
          test_json() {
            name="$1"; url="$2"
            code=$(curl -L -A "$UA" --max-time 15 -sS -o /tmp/source -w '%{http_code}' "$url")
            bytes=$(wc -c </tmp/source)
            echo "SOURCE|$name|HTTP=$code|bytes=$bytes"
            test "$code" = "200"
            test "$bytes" -gt 50
          }
          test_page() {
            name="$1"; url="$2"; marker="$3"
            code=$(curl -L -A "$UA" --max-time 15 -sS -o /tmp/source -w '%{http_code}' "$url" || true)
            bytes=$(wc -c </tmp/source 2>/dev/null || echo 0)
            hits=$(grep -Eio "$marker" /tmp/source 2>/dev/null | head -3 | tr '\n' ',' || true)
            echo "SOURCE|$name|HTTP=$code|bytes=$bytes|marker=$hits"
          }
          test_json 'Polskie Radio API PR1' 'https://apipr.polskieradio.pl/api/schedule?Program=1'
          test_json 'Polskie Radio API PR3' 'https://apipr.polskieradio.pl/api/schedule?Program=3'
          grep -q '"Schedule"' /tmp/source
          test_page 'TOK FM' 'https://audycje.tokfm.pl/ramowka?v=2' 'Ramówka|Pierwszy Program|TOK360|Poranek TOK'
          test_page 'RMF FM' 'https://www.rmf.fm/' 'Co było grane|Co bylo grane'
          test_page 'Radio ZET' 'https://player.radiozet.pl/Programy' 'Programy|Dzień Dobry Bardzo'
          test_page 'VOX FM' 'https://www.voxfm.pl/co-bylo-grane/' 'grane|Grali'
          test_page 'RMF Classic' 'https://www.rmfclassic.pl/radio/ramowka' 'ON AIR|ramówka|ramowka'
          test_page 'RMF MAXX' 'https://www.rmfmaxx.pl/muzyka/playlista' 'Playlista|Lista utworów'
          test_page 'Złote Przeboje' 'https://radio.zloteprzeboje.pl/co-gralismy' 'graliśmy|gralismy'
          test_page 'Radio Pogoda' 'https://moje.radiopogoda.pl/co-gralismy' 'graliśmy|gralismy'
          test_page 'ESKA' 'https://www.eska.pl/co-bylo-grane/' 'grane|Grali'
          test_page 'ESKA2' 'https://dwa.eska.pl/co-bylo-grane/' 'grane|Grali'
          test_page 'Eska ROCK' 'https://www.eskarock.pl/co-bylo-grane/' 'grane|Grali'
          test_page 'Arabella' 'https://www.radioarabella.de/' 'On Air|Zuletzt gehört|Zuletzt gehort'
          test_page 'ANTENNE BAYERN' 'https://www.antenne.de/webradio/live' 'Gerade läuft|Gerade laeuft'
          test_page 'ROCK ANTENNE' 'https://www.rockantenne.de/rockhoeren/streams/live' 'Gerade läuft|Gerade laeuft'
          test_page 'Bayern 2' 'https://www.br.de/radio/live/bayern-2/' 'Bayern 2'
          test_page 'Bayern 3' 'https://www.br.de/radio/live/bayern-3/' 'Bayern 3'
          test_page 'BR24' 'https://www.br.de/radio/live/br24/' 'BR24'
          test_page 'BR-KLASSIK' 'https://www.br.de/radio/live/br-klassik/' 'BR Klassik|BR-KLASSIK'
          test_page 'BR Heimat' 'https://www.br.de/radio/live/br-heimat/' 'BR Heimat'
          test_page 'Deutschlandfunk' 'https://www.deutschlandfunk.de/programm/' 'Programm|Uhr'
          test_page 'DLF Kultur' 'https://www.deutschlandfunkkultur.de/' 'Live|Uhr'

      - name: Restore verified 1.7.28 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir artifact project
          gh run download 37471932163 -R senikolo/Pomocnik-Alfa -n Pomocnik-Alfa-1.7.28-SOURCE -D artifact
          tar -xJf artifact/Pomocnik-Alfa-1.7.28-SOURCE.tar.xz -C project
          grep -n "versionCode 10728" project/app/build.gradle
          test "$(grep -c '^ *{"' project/app/src/main/java/com/ispina/lokalnie/RadioActivity.java)" -ge 24

      - name: Apply 1.7.29 Full Radio Info patch
        run: |
          set -euxo pipefail
          base64 -d patches/radio-full-info-1729.patch.gz.b64 | gzip -dc > /tmp/pa1729.patch
          cd project
          patch -p0 < /tmp/pa1729.patch
          grep -n "versionCode 10729" app/build.gradle
          grep -n 'eq(station,"TOK FM")' app/src/main/java/com/ispina/lokalnie/radio/RadioInfoPlus.java
          grep -n 'eq(station,"Antenne Bayern")' app/src/main/java/com/ispina/lokalnie/radio/RadioInfoPlus.java
          grep -n 'eq(station,"BR-KLASSIK")' app/src/main/java/com/ispina/lokalnie/radio/RadioInfoPlus.java
          grep -n 'Brazilian Birds' app/src/main/java/com/ispina/lokalnie/radio/RadioInfoPlus.java
          tar -cJf ../Pomocnik-Alfa-1.7.29-SOURCE.tar.xz .

      - name: Make side-by-side test package
        run: |
          set -euxo pipefail
          sed -i "s/applicationId 'com.senikolo.pomocniknowy'/applicationId 'com.senikolo.pomocniknowy.radio1729'/" project/app/build.gradle
          sed -i 's/android:label="Pomocnik Alfa"/android:label="Pomocnik Alfa RADIO FULL 1.7.29"/' project/app/src/main/AndroidManifest.xml

      - name: Prepare Android SDK
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: project
        run: |
          set -euxo pipefail
          chmod +x gradlew
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          android.useAndroidX=true
          EOF
          ./gradlew --no-daemon assembleDebug -x lint --stacktrace
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" ../Pomocnik-Alfa-1.7.29-RADIO-FULL-INFO.apk

      - name: Verify APK
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s Pomocnik-Alfa-1.7.29-RADIO-FULL-INFO.apk
          "$BT/aapt" dump badging Pomocnik-Alfa-1.7.29-RADIO-FULL-INFO.apk | head -3
          "$BT/apksigner" verify --verbose --print-certs Pomocnik-Alfa-1.7.29-RADIO-FULL-INFO.apk
          sha256sum Pomocnik-Alfa-1.7.29-RADIO-FULL-INFO.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pomocnik-Alfa-1.7.29-RADIO-FULL-INFO
          path: Pomocnik-Alfa-1.7.29-RADIO-FULL-INFO.apk
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: Pomocnik-Alfa-1.7.29-SOURCE
          path: Pomocnik-Alfa-1.7.29-SOURCE.tar.xz
          retention-days: 3
