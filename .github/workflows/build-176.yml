name: Build Pomocnik Alfa 1.7.6

on:
  push:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: github.event_name != 'issues' || github.event.issue.title == 'TRIGGER PA 1.7.6 BUILD'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download 1.7.6 source package
        run: |
          set -euxo pipefail
          curl -fL --retry 4 --retry-delay 3 \
            "https://f366ae4b-1478-4dc8-b5e5-0c4f287fe888.sandbox.floot.app/_cdn/static/8c9b84bd-d903-41e1-b51b-6f52ccf67725-pa176-compile-micro.tar.xz" \
            -o source.tar.xz
          mkdir project
          tar -xJf source.tar.xz -C project
          test -f project/app/build.gradle
          grep -n "versionName '1.7.6'" project/app/build.gradle
          grep -n "versionCode 10706" project/app/build.gradle

      - name: Prepare Android SDK 35
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: project
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pomocnik-Alfa-1.7.6-placeholder
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish temporary build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-1.7.6 -y || true
          git push --delete origin build-1.7.6 || true
          gh release create build-1.7.6 \
            "project/app/build/outputs/apk/debug/app-debug.apk#Pomocnik-Alfa-1.7.6-PLACEHOLDER.apk" \
            --title "Pomocnik Alfa 1.7.6 temporary build" \
            --notes "Automatyczny build 1.7.6 z lekkimi placeholderami ciężkich zasobów. Plik jest etapem pośrednim do finalnego scalenia i podpisania."

      - name: Report workflow result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          gh issue create \
            --title "PA 1.7.6 BUILD ${BUILD_STATUS} ${GITHUB_RUN_ID}" \
            --body "Status: ${BUILD_STATUS}

Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

Commit: ${GITHUB_SHA}"
