      - name: Apply 1.7.10 playback stability fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ta = Path("project/app/src/main/java/com/ispina/lokalnie/TubeActivity.java")
          s = ta.read_text()

          # Android 8-11: activity is already foreground when the user taps Play.
          # Do not start TubeService as a foreground service and risk the 5-second
          # ForegroundServiceDidNotStartInTimeException process kill.
          s = re.sub(r'if\(Build\.VERSION\.SDK_INT>=26\)startForegroundService\(([^;]+)\);else startService\(\1\);',
                     r'startService(\1);', s)
          s = re.sub(r'startForegroundService\((new Intent\(this,TubeService\.class\))\);',
                     r'startService(\1);', s)

          # Keep recommendation UI lighter while the player is active.
          s = s.replace('if(out.size()==12)break;', 'if(out.size()==6)break;')
          ta.write_text(s)

          ts = Path("project/app/src/main/java/com/ispina/lokalnie/tube/TubeService.java")
          s = ts.read_text()

          # Avoid rebuilding the MediaSource when Android reports initial network
          # capabilities a few seconds after playback starts. Initial quality is
          # already selected by TubeActivity.defaultQuality().
          s = re.sub(
              r'public void onCapabilitiesChanged\(android\.net\.Network n,android\.net\.NetworkCapabilities c\)\{clock\.post\(\(\)->adaptNetwork\(\)\);\}',
              'public void onCapabilitiesChanged(android.net.Network n,android.net.NetworkCapabilities c){}',
              s
          )

          # Harden manual source switching against a transient -1 media index.
          s = s.replace(
              'int index=player.getCurrentMediaItemIndex();player.removeMediaItem(index);',
              'int index=player.getCurrentMediaItemIndex();if(index<0||index>=player.getMediaItemCount())return;player.removeMediaItem(index);'
          )

          # Smaller buffer reduces peak memory on older / lower-RAM phones.
          s = s.replace(
              'setBufferDurationsMs(10000,30000,1500,2000)',
              'setBufferDurationsMs(6000,18000,1200,1800)'
          )
          ts.write_text(s)

          ti = Path("project/app/src/main/java/com/ispina/lokalnie/tube/TubeImages.java")
          s = ti.read_text()
          s = s.replace('4*1024*1024', '2*1024*1024')
          s = s.replace('>960)opt.inSampleSize*=2', '>480)opt.inSampleSize*=2')
          ti.write_text(s)

          # Build-time assertions: fail rather than silently ship an unfixed APK.
          ta_s = ta.read_text()
          ts_s = ts.read_text()
          ti_s = ti.read_text()
          assert 'startForegroundService(new Intent(this,TubeService.class))' not in ta_s
          assert 'if(out.size()==6)break;' in ta_s
          assert 'onCapabilitiesChanged(android.net.Network n,android.net.NetworkCapabilities c){}' in ts_s
          assert 'index<0||index>=player.getMediaItemCount()' in ts_s
          assert 'setBufferDurationsMs(6000,18000,1200,1800)' in ts_s
          assert '>480)opt.inSampleSize*=2' in ti_s
          print("PA 1.7.10 playback stability patch OK")
          PY

      - name: Apply 1.7.11 deep audit fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # TubeActivity: cancel stale opens, keep UI state consistent,
          # and let native Media3 controls receive their own touch events.
          p=Path("project/app/src/main/java/com/ispina/lokalnie/TubeActivity.java")
          s=p.read_text()
          s=s.replace(
              'private void screen(String name){if(saver)setSaver(false);if(fullscreen)setFullscreen(false);',
              'private void screen(String name){openingVideo=false;if(saver)setSaver(false);if(fullscreen)setFullscreen(false);'
          )
          s=s.replace(
              'private void open(Video v,int mode,boolean startOver){\n  if(v==null||v.url==null||v.url.trim().isEmpty())',
              'private void open(Video v,int mode,boolean startOver){\n  final int requestGeneration=generation;\n  if(v==null||v.url==null||v.url.trim().isEmpty())'
          )
          s=s.replace(
              'waitService(full,mode,0,startOver);',
              'waitService(full,mode,0,startOver,requestGeneration);'
          )
          old=''' private void waitService(Video full,int mode,int attempts){waitService(full,mode,attempts,false);}
           private void waitService(Video full,int mode,int attempts,boolean startOver){if(!alive){openingVideo=false;return;}TubeService s=TubeService.active;if(s==null){if(attempts<50)main.postDelayed(()->waitService(full,mode,attempts+1,startOver),100);else {openingVideo=false;message("Nie udało się uruchomić odtwarzacza. Spróbuj ponownie.");}return;}try{s.add(full,quality,audio,subtitle,onlyAudio,mode,startOver);if(mode==0){openingVideo=false;if(Build.VERSION.SDK_INT>=33&&checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS)!=android.content.pm.PackageManager.PERMISSION_GRANTED)requestPermissions(new String[]{android.Manifest.permission.POST_NOTIFICATIONS},20);playerScreen();if(store.flag("saver",false))setSaver(true);}else {openingVideo=false;message("Dodano do kolejki.");}}catch(Exception|LinkageError e){openingVideo=false;android.util.Log.e("AlfaTube","Błąd uruchamiania ścieżki",e);message("Nie udało się odtworzyć tej ścieżki. Spróbuj innego filmu lub jakości.");}}'''
          new=''' private void waitService(Video full,int mode,int attempts){waitService(full,mode,attempts,false,generation);}
           private void waitService(Video full,int mode,int attempts,boolean startOver){waitService(full,mode,attempts,startOver,generation);}
           private void waitService(Video full,int mode,int attempts,boolean startOver,int requestGeneration){if(!alive||requestGeneration!=generation){openingVideo=false;return;}TubeService s=TubeService.active;if(s==null){if(attempts<50)main.postDelayed(()->waitService(full,mode,attempts+1,startOver,requestGeneration),100);else {openingVideo=false;message("Nie udało się uruchomić odtwarzacza. Spróbuj ponownie.");}return;}try{s.add(full,quality,audio,subtitle,onlyAudio,mode,startOver);if(mode==0){openingVideo=false;if(Build.VERSION.SDK_INT>=33&&checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS)!=android.content.pm.PackageManager.PERMISSION_GRANTED)requestPermissions(new String[]{android.Manifest.permission.POST_NOTIFICATIONS},20);playerScreen();if(store.flag("saver",false))setSaver(true);}else {openingVideo=false;message("Dodano do kolejki.");}}catch(Exception|LinkageError e){openingVideo=false;android.util.Log.e("AlfaTube","Błąd uruchamiania ścieżki",e);message("Nie udało się odtworzyć tej ścieżki. Spróbuj innego filmu lub jakości.");}}'''
          if old not in s:
              raise SystemExit("waitService block not found")
          s=s.replace(old,new)
          s=s.replace(
              ' View nativeControls=view.findViewById(androidx.media3.ui.R.id.exo_controller);if(nativeControls!=null)nativeControls.setOnTouchListener((v,event)->controlsLocked||playerGestures.onTouchEvent(event));\n',
              ''
          )
          s=s.replace(
              'saverPanel=null;bar.setVisibility(View.VISIBLE);bottomNav.setVisibility(View.VISIBLE);scroll.setVisibility(View.VISIBLE);',
              'saverPanel=null;bar.setVisibility(View.VISIBLE);bottomNav.setVisibility(view!=null?View.GONE:View.VISIBLE);scroll.setVisibility(View.VISIBLE);'
          )
          s=s.replace(
              'if(bottomNav!=null)bottomNav.setVisibility(in?View.GONE:View.VISIBLE);',
              'if(bottomNav!=null)bottomNav.setVisibility(in?View.GONE:(view!=null?View.GONE:View.VISIBLE));'
          )
          s=s.replace(
              'TextView author=NativeUi.muted(this,video.author+" · "+duration(video.duration),12);',
              'String recommendationAuthor=(video.author==null||video.author.trim().isEmpty())?"Materiał wideo":video.author;TextView author=NativeUi.muted(this,recommendationAuthor+" · "+duration(video.duration),12);'
          )
          p.write_text(s)

          # TubeService: source creation must not mutate the currently playing
          # item's track state. Make source switching transactional enough to
          # avoid transient media-item callbacks corrupting current.
          p=Path("project/app/src/main/java/com/ispina/lokalnie/tube/TubeService.java")
          s=p.read_text()
          s=s.replace(
              'private boolean audioOnly;public Video current;',
              'private boolean audioOnly,switchingSource;public Video current;'
          )
          s=s.replace(
              'public void onMediaItemTransition(MediaItem i,int reason){current=i==null?null:videos.get(i.mediaId);error="";}',
              'public void onMediaItemTransition(MediaItem i,int reason){if(switchingSource)return;current=i==null?null:videos.get(i.mediaId);error="";}'
          )
          s=s.replace(
              'if(mode==0){currentQuality=quality;currentAudio=audio;currentSub=subtitle;audioOnly=onlyAudio;player.setMediaSource(source);current=v;player.prepare();player.seekTo(TubeUx.resumePosition(store.prefs.getLong("position:"+v.url,0),v.duration>0?v.duration*1000:0));player.play();}',
              'if(mode==0){currentQuality=quality;currentAudio=audio;currentSub=subtitle;audioOnly=onlyAudio;player.setMediaSource(source);current=v;applyOnlyAudio(onlyAudio);player.prepare();player.seekTo(TubeUx.resumePosition(store.prefs.getLong("position:"+v.url,0),v.duration>0?v.duration*1000:0));player.play();}'
          )
          old_switch='public void switchSource(int quality,int audio,int subtitle,boolean onlyAudio){if(current==null)return;currentQuality=quality;currentAudio=audio;currentSub=subtitle;audioOnly=onlyAudio;Video v=current;long pos=player.getCurrentPosition();boolean play=player.getPlayWhenReady();MediaSource s=source(v,quality,audio,subtitle,onlyAudio);int index=player.getCurrentMediaItemIndex();if(index<0||index>=player.getMediaItemCount())return;player.removeMediaItem(index);player.addMediaSource(index,s);player.seekTo(index,pos);player.prepare();player.setPlayWhenReady(play);}'
          new_switch='public void switchSource(int quality,int audio,int subtitle,boolean onlyAudio){if(current==null||player==null)return;Video v=current;long pos=player.getCurrentPosition();boolean play=player.getPlayWhenReady();MediaSource replacement=source(v,quality,audio,subtitle,onlyAudio);int index=player.getCurrentMediaItemIndex();if(index<0||index>=player.getMediaItemCount())return;switchingSource=true;try{player.setPlayWhenReady(false);player.removeMediaItem(index);player.addMediaSource(index,replacement);current=v;currentQuality=quality;currentAudio=audio;currentSub=subtitle;audioOnly=onlyAudio;applyOnlyAudio(onlyAudio);player.seekTo(index,pos);player.prepare();player.setPlayWhenReady(play);error="";}finally{switchingSource=false;}}'
          if old_switch not in s:
              raise SystemExit("switchSource block not found")
          s=s.replace(old_switch,new_switch)
          s=s.replace('new DefaultHttpDataSource.Factory().setUserAgent("PomocnikAlfa/1.7.9")',
                      'new DefaultHttpDataSource.Factory().setUserAgent("PomocnikAlfa/1.7.11")')
          s=s.replace(
              ' player.setTrackSelectionParameters(player.getTrackSelectionParameters().buildUpon().setTrackTypeDisabled(C.TRACK_TYPE_VIDEO,only).build());return main;\n }',
              ' return main;\n }\n private void applyOnlyAudio(boolean only){if(player!=null)player.setTrackSelectionParameters(player.getTrackSelectionParameters().buildUpon().setTrackTypeDisabled(C.TRACK_TYPE_VIDEO,only).build());}'
          )
          s=s.replace(
              'public void close(){setSleepTimer(0);remember();player.stop();player.clearMediaItems();current=null;videos.clear();stopSelf();}',
              'public void close(){setSleepTimer(0);remember();error="";player.stop();player.clearMediaItems();current=null;videos.clear();stopSelf();}'
          )
          p.write_text(s)

          # TubeImages: bound both dimensions, survive bitmap OOM, delete partial
          # downloads, and avoid replacing placeholders with null bitmaps.
          p=Path("project/app/src/main/java/com/ispina/lokalnie/tube/TubeImages.java")
          p.write_text("""package com.ispina.lokalnie.tube;
          import android.content.Context;import android.graphics.*;import android.widget.*;import android.util.LruCache;import java.io.*;import java.net.*;import java.lang.ref.WeakReference;import java.util.concurrent.*;
          public final class TubeImages {
           private static final ExecutorService io=Executors.newFixedThreadPool(2);
           private static final LruCache<String,Bitmap> memory=new LruCache<String,Bitmap>(2*1024*1024){protected int sizeOf(String k,Bitmap b){return b.getAllocationByteCount();}};
           private static Bitmap decodeSampled(File file){
            try{BitmapFactory.Options bounds=new BitmapFactory.Options();bounds.inJustDecodeBounds=true;BitmapFactory.decodeFile(file.getPath(),bounds);if(bounds.outWidth<=0||bounds.outHeight<=0)return null;int sample=1;while(bounds.outWidth/sample>480||bounds.outHeight/sample>480)sample*=2;BitmapFactory.Options opt=new BitmapFactory.Options();opt.inSampleSize=sample;return BitmapFactory.decodeFile(file.getPath(),opt);}catch(OutOfMemoryError oom){memory.evictAll();return null;}
           }
           public static void bind(ImageView image,String url,ScrollView scroll){if(url==null||url.isEmpty())return;image.setTag(url);Bitmap cached=memory.get(url);if(cached!=null){image.setImageBitmap(cached);return;}WeakReference<ImageView> ref=new WeakReference<>(image);Context app=image.getContext().getApplicationContext();final boolean[] started={false};Runnable load=()->{if(started[0])return;started[0]=true;io.execute(()->{try{Bitmap b=null;if(url.startsWith("file:")){File local=new File(android.net.Uri.parse(url).getPath());b=decodeSampled(local);}else{File dir=new File(app.getCacheDir(),"tube_thumbs");dir.mkdirs();File f=new File(dir,Integer.toHexString(url.hashCode()));if(!f.exists()){HttpURLConnection c=(HttpURLConnection)new URL(url).openConnection();File temp=new File(f+".tmp");try{c.setConnectTimeout(8000);c.setReadTimeout(8000);if(c.getResponseCode()!=200)return;try(InputStream in=c.getInputStream();OutputStream out=new FileOutputStream(temp)){byte[] buf=new byte[4096];int n,total=0;while((n=in.read(buf))!=-1){total+=n;if(total>2*1024*1024)throw new IOException("Miniatura jest zbyt duża.");out.write(buf,0,n);}}if(!temp.renameTo(f)){temp.delete();return;}}finally{c.disconnect();if(temp.exists()&&!f.exists())temp.delete();}}b=decodeSampled(f);trim(dir);}if(b!=null){memory.put(url,b);Bitmap result=b;ImageView v=ref.get();if(v!=null)v.post(()->{ImageView target=ref.get();if(target!=null&&url.equals(target.getTag()))target.setImageBitmap(result);});}}catch(Exception ignored){}catch(OutOfMemoryError oom){memory.evictAll();}});};if(scroll==null){image.post(load);return;}ViewCheck check=new ViewCheck(ref,scroll,load);scroll.getViewTreeObserver().addOnScrollChangedListener(check);image.post(check::onScrollChanged);}
           static class ViewCheck implements android.view.ViewTreeObserver.OnScrollChangedListener {final WeakReference<ImageView> ref;final WeakReference<ScrollView> scroll;final Runnable load;ViewCheck(WeakReference<ImageView> r,ScrollView s,Runnable l){ref=r;scroll=new WeakReference<>(s);load=l;}public void onScrollChanged(){ImageView v=ref.get();ScrollView s=scroll.get();if(s==null)return;if(v==null){s.getViewTreeObserver().removeOnScrollChangedListener(this);return;}android.graphics.Rect r=new android.graphics.Rect();if(v.getGlobalVisibleRect(r)){s.getViewTreeObserver().removeOnScrollChangedListener(this);load.run();}}}
           static synchronized void trim(File d){File[] files=d.listFiles();if(files==null)return;long total=0;for(File f:files)total+=f.length();if(total>20*1024*1024){java.util.Arrays.sort(files,java.util.Comparator.comparingLong(File::lastModified));for(File f:files){total-=f.length();f.delete();if(total<=15*1024*1024)break;}}}
           public static void clear(Context c){memory.evictAll();File[] f=new File(c.getCacheDir(),"tube_thumbs").listFiles();if(f!=null)for(File x:f)x.delete();}
          }
          """)

          # Extractor hardening without changing dependency versions.
