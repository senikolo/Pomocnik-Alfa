name: Fast Build Pomocnik Alfa 1.7.24 Radio Info

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  build:
    if: ${{ github.event_name != 'issues' || github.event.issue.title == 'TRIGGER PA 1.7.24 RADIO INFO FAST' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore source and apply patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir artifact project
          gh run download 37450458198 -R senikolo/Pomocnik-Alfa -n Pomocnik-Alfa-1.7.23-SOURCE -D artifact
          tar -xJf artifact/Pomocnik-Alfa-1.7.23-SOURCE.tar.xz -C project
          base64 -d patches/radio-now-playing-1724.patch.gz.b64 | gzip -dc > /tmp/pa1724.patch
          cd project
          patch -p1 < /tmp/pa1724.patch
          sed -i "s/applicationId 'com.senikolo.pomocniknowy'/applicationId 'com.senikolo.pomocniknowy.radioinfo1724'/" app/build.gradle
          sed -i 's/android:label="Pomocnik Alfa"/android:label="Pomocnik Alfa RADIO INFO"/' app/src/main/AndroidManifest.xml
          grep -n "versionCode 10724" app/build.gradle
          grep -n "Teraz na antenie" app/src/main/java/com/ispina/lokalnie/RadioActivity.java
          grep -n "onMetadata" app/src/main/java/com/ispina/lokalnie/radio/RadioService.java
      - name: Prepare SDK
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
      - name: Build
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -x lint --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Pomocnik-Alfa-1.7.24-RADIO-INFO.apk
      - name: Verify
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Pomocnik-Alfa-1.7.24-RADIO-INFO.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Pomocnik-Alfa-1.7.24-RADIO-INFO.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: Pomocnik-Alfa-1.7.24-RADIO-INFO
          path: Pomocnik-Alfa-1.7.24-RADIO-INFO.apk
          retention-days: 7
